<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园生活提醒助手</title>
    <style>
        /* ===== 猫啃什锦黑（可爱圆润中文字体） ===== */
        @font-face {
            font-family: 'MaoKenShiJinHei';
            src: url('/fonts/MaoKenShiJinHei-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 猫啃猪圆体（正文用，圆润柔和） ===== */
        @font-face {
            font-family: 'MaoKenZhuYuanTi';
            src: url('/fonts/MaoKenZhuYuanTi-MaokenZhuyuanTi-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 奶油蜜桃色彩令牌 ===== */
        :root {
            --cream-bg: #FFF5F5;
            --cream-card: #FFFFFF;
            --peach: #FFB5A7;
            --peach-light: #FFCAC0;
            --peach-soft: #FFDFD7;
            --peach-pale: #FFF0EC;
            --brown-deep: #5C4033;
            --brown-mid: #8B7355;
            --brown-light: #B59D85;
            --brown-pale: #F5E6E0;
            --danger: #FF7B89;
            --shadow-soft: 0 4px 20px rgba(255, 181, 167, 0.15);
            --shadow-hover: 0 8px 28px rgba(255, 181, 167, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'MaoKenZhuYuanTi', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF5F5 0%, #FFE4E1 100%);
            color: var(--brown-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
        }

        .auth-container {
            background: var(--cream-card);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 420px;
            border: 2px solid var(--peach-pale);
            animation: floatUp 0.6s ease-out;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-container h1 {
            text-align: center;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin-bottom: 8px;
            color: var(--brown-deep);
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .auth-container .subtitle {
            text-align: center;
            color: var(--brown-mid);
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.8;
        }

        .auth-container .form-group { margin-bottom: 20px; }

        .auth-container label {
            display: block;
            margin-bottom: 10px;
            color: var(--brown-deep);
            font-size: 15px;
            padding-left: 4px;
        }

        .auth-container input {
            width: 100%;
            padding: 12px 18px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--brown-pale);
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            height: 48px;
            transition: all 0.25s ease;
            outline: none;
        }

        .auth-container input:hover { border-color: var(--peach-soft); background: #FFFCF8; }

        .auth-container input:focus {
            border-color: var(--peach);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 181, 167, 0.12);
        }

        .auth-container input::placeholder { color: var(--brown-light); }

        .auth-container .code-group { display: flex; gap: 10px; }

        .auth-container .code-group input { flex: 1; }

        .auth-container .code-group button {
            flex: 0 0 120px;
            height: 48px;
            padding: 12px 16px;
            background: var(--peach-pale);
            color: var(--brown-deep);
            border: 2px solid var(--peach-soft);
            border-radius: 14px;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            line-height: 1.4;
            box-shadow: none;
            letter-spacing: 0;
        }

        .auth-container .code-group button:hover:not(:disabled) {
            background: var(--peach-soft);
            transform: translateY(-1px);
        }

        .auth-container .code-group button:active:not(:disabled) { transform: translateY(0); }

        .auth-container .code-group button:disabled {
            background: var(--brown-pale);
            color: var(--brown-light);
            border-color: var(--brown-pale);
            cursor: not-allowed;
            opacity: 0.8;
        }

        .auth-container .submit-btn {
            width: 100%;
            padding: 12px 24px;
            height: 48px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(255, 181, 167, 0.35);
            margin-top: 8px;
        }

        .auth-container .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 181, 167, 0.45);
        }

        .auth-container .submit-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(255, 181, 167, 0.3);
        }

        .auth-container .submit-btn:disabled {
            background: var(--peach-soft);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        .auth-container .links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--brown-mid);
        }

        .auth-container .links a {
            color: var(--peach);
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-container .links a:hover { color: var(--peach-light); }

        .auth-container .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
            padding-left: 4px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        #toast {
            display: none;
            padding: 12px 24px;
            background: var(--brown-deep);
            color: #FFFFFF;
            border-radius: 12px;
            position: fixed;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            font-size: 14px;
            box-shadow: var(--shadow-hover);
            animation: toastIn 0.35s ease-out;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 验证码弹窗（复用奶油蜜桃色彩令牌，与页面风格统一） ===== */
        #codeModalMask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(92, 64, 51, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: maskIn 0.25s ease-out;
        }

        @keyframes maskIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #codeModalMask .code-modal {
            background: var(--cream-card);
            border-radius: 28px;
            box-shadow: var(--shadow-hover);
            padding: 36px 32px 28px;
            width: 100%;
            max-width: 360px;
            border: 2px solid var(--peach-pale);
            animation: modalFloatUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
        }

        @keyframes modalFloatUp {
            from { opacity: 0; transform: translateY(24px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #codeModalMask .code-modal-icon {
            font-size: 40px;
            margin-bottom: 10px;
            line-height: 1;
        }

        #codeModalMask .code-modal-title {
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 20px;
            color: var(--brown-deep);
            margin-bottom: 6px;
            letter-spacing: 1.5px;
            font-weight: normal;
        }

        #codeModalMask .code-modal-tip {
            font-size: 13px;
            color: var(--brown-mid);
            margin-bottom: 22px;
            line-height: 1.7;
        }

        #codeModalMask .code-display {
            background: linear-gradient(135deg, var(--peach-pale) 0%, var(--peach-soft) 100%);
            border: 2px dashed var(--peach);
            border-radius: 18px;
            padding: 22px 16px;
            margin-bottom: 22px;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 38px;
            letter-spacing: 10px;
            color: var(--brown-deep);
            font-weight: normal;
            text-indent: 10px;
            position: relative;
            overflow: hidden;
        }

        #codeModalMask .code-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.5) 50%, transparent 60%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translateX(-30%); }
            50% { transform: translateX(30%); }
        }

        #codeModalMask .code-modal-btn {
            width: 100%;
            height: 48px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(255, 181, 167, 0.35);
        }

        #codeModalMask .code-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 181, 167, 0.45);
        }

        #codeModalMask .code-modal-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(255, 181, 167, 0.3);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>🍑 校园生活提醒助手</h1>
        <p class="subtitle">创建新账号</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" required>
                <div class="error" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-group">
                    <input type="text" id="code" placeholder="请输入验证码" maxlength="6" required>
                    <button type="button" id="sendCodeBtn">获取验证码</button>
                </div>
                <div class="error" id="codeError"></div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码（8位以上，含字母+数字）" required>
                <div class="error" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入密码" required>
                <div class="error" id="confirmError"></div>
            </div>

            <button type="submit" class="submit-btn" id="registerBtn">注册</button>
        </form>

        <div class="links">
            已有账号？<a href="/login">去登录 →</a>
        </div>
    </div>

    <div id="toast"></div>

    <!-- 验证码弹窗 -->
    <div id="codeModalMask">
        <div class="code-modal">
            <div class="code-modal-icon">📩</div>
            <h2 class="code-modal-title">你的验证码</h2>
            <p class="code-modal-tip">验证码已生成，请记下后填入下方验证码输入框～</p>
            <div class="code-display" id="codeDisplay">------</div>
            <button type="button" class="code-modal-btn" id="codeModalCloseBtn">我已记住</button>
        </div>
    </div>

    <script>
        var phoneInput = document.getElementById('phone');
        var codeInput = document.getElementById('code');
        var passwordInput = document.getElementById('password');
        var confirmInput = document.getElementById('confirmPassword');
        var sendCodeBtn = document.getElementById('sendCodeBtn');
        var registerForm = document.getElementById('registerForm');
        var toast = document.getElementById('toast');
        var registerBtn = document.getElementById('registerBtn');
        var codeModalMask = document.getElementById('codeModalMask');
        var codeDisplay = document.getElementById('codeDisplay');
        var codeModalCloseBtn = document.getElementById('codeModalCloseBtn');

        function showToast(message, isSuccess) {
            toast.textContent = message;
            toast.style.display = 'block';
            toast.style.background = isSuccess ? '#8ED4A6' : '#FF7B89';
            toast.style.color = '#fff';
            setTimeout(function() {
                toast.style.display = 'none';
            }, 3000);
        }

        function showCodeModal(code) {
            codeDisplay.textContent = code || '------';
            codeModalMask.style.display = 'flex';
        }

        function closeCodeModal() {
            codeModalMask.style.display = 'none';
        }

        codeModalCloseBtn.addEventListener('click', closeCodeModal);
        codeModalMask.addEventListener('click', function(e) {
            if (e.target === codeModalMask) closeCodeModal();
        });

        function isValidPhone(phone) {
            return /^1[3-9]\d{9}$/.test(phone);
        }

        function isValidPassword(password) {
            return /^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(password);
        }

        sendCodeBtn.addEventListener('click', function() {
            var phone = phoneInput.value.trim();

            document.querySelectorAll('.error').forEach(function(el) {
                el.style.display = 'none';
            });

            if (!isValidPhone(phone)) {
                document.getElementById('phoneError').textContent = '请输入正确的手机号';
                document.getElementById('phoneError').style.display = 'block';
                return;
            }

            sendCodeBtn.disabled = true;

            fetch('/api/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.success) {
                    showCodeModal(data.code);

                    var countdown = 60;
                    sendCodeBtn.textContent = countdown + 's';

                    var timer = setInterval(function() {
                        countdown--;
                        sendCodeBtn.textContent = countdown + 's';
                        if (countdown <= 0) {
                            clearInterval(timer);
                            sendCodeBtn.disabled = false;
                            sendCodeBtn.textContent = '获取验证码';
                        }
                    }, 1000);
                } else {
                    showToast(data.message || '发送失败，请重试', false);
                    sendCodeBtn.disabled = false;
                }
            })
            .catch(function() {
                showToast('网络错误，请重试', false);
                sendCodeBtn.disabled = false;
            });
        });

        registerForm.addEventListener('submit', function(event) {
            event.preventDefault();

            var phone = phoneInput.value.trim();
            var code = codeInput.value.trim();
            var password = passwordInput.value;
            var confirmPassword = confirmInput.value;

            document.querySelectorAll('.error').forEach(function(el) {
                el.style.display = 'none';
            });

            var valid = true;

            if (!isValidPhone(phone)) {
                document.getElementById('phoneError').textContent = '请输入正确的手机号';
                document.getElementById('phoneError').style.display = 'block';
                valid = false;
            }

            if (code.length !== 6) {
                document.getElementById('codeError').textContent = '请输入6位验证码';
                document.getElementById('codeError').style.display = 'block';
                valid = false;
            }

            if (!isValidPassword(password)) {
                document.getElementById('passwordError').textContent = '密码需8位以上，含字母和数字';
                document.getElementById('passwordError').style.display = 'block';
                valid = false;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmError').textContent = '两次密码输入不一致';
                document.getElementById('confirmError').style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            registerBtn.disabled = true;
            registerBtn.textContent = '注册中...';

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: phone,
                    code: code,
                    password: password
                })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';

                if (data.success) {
                    showToast('注册成功！即将跳转登录', true);
                    setTimeout(function() {
                        window.location.href = '/login?phone=' + encodeURIComponent(phone);
                    }, 1500);
                } else {
                    showToast(data.message || '注册失败，请重试', false);
                }
            })
            .catch(function() {
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
                showToast('网络错误，请重试', false);
            });
        });
    </script>
</body>
</html>
