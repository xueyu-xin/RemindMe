<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园生活提醒助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; width: 100%; max-width: 400px; }
        h1 { text-align: center; margin-bottom: 8px; color: #333; }
        p { text-align: center; color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        .code-group { display: flex; gap: 10px; }
        .code-group input { flex: 1; }
        .code-group button { flex: 0 0 100px; padding: 12px; background: #f0f0f0; color: #333; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .code-group button:hover { background: #e0e0e0; }
        .code-group button.disabled { opacity: 0.5; cursor: not-allowed; }
        button.submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.3s; }
        button.submit:hover { opacity: 0.9; }
        .links { text-align: center; margin-top: 20px; }
        a { color: #667eea; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error { color: #e74c3c; font-size: 14px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>校园生活提醒助手</h1>
        <p>创建新账号</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11">
                <div class="error" id="phoneError"></div>
            </div>
            
            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-group">
                    <input type="text" id="code" placeholder="请输入验证码" maxlength="6">
                    <button type="button" id="sendCodeBtn">获取验证码</button>
                </div>
                <div class="error" id="codeError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码（至少8位）">
                <div class="error" id="passwordError"></div>
            </div>
            
            <button type="submit" class="submit">注册</button>
        </form>
        
        <div class="links">
            <p>已有账号？<a href="/login">立即登录</a></p>
        </div>
    </div>
    
    <script>
        let countdown = 0;
        
        document.getElementById('sendCodeBtn').addEventListener('click', async () => {
            const phone = document.getElementById('phone').value;
            
            if (!phone || phone.length !== 11) {
                document.getElementById('phoneError').textContent = '请输入11位手机号';
                document.getElementById('phoneError').style.display = 'block';
                return;
            }
            
            const btn = document.getElementById('sendCodeBtn');
            btn.classList.add('disabled');
            
            try {
                const response = await fetch(`/api/auth/send-code?phone=${phone}`, { method: 'POST' });
                const data = await response.json();
                
                if (response.ok) {
                    countdown = 60;
                    btn.textContent = `${countdown}秒`;
                    
                    const timer = setInterval(() => {
                        countdown--;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btn.textContent = '获取验证码';
                            btn.classList.remove('disabled');
                        } else {
                            btn.textContent = `${countdown}秒`;
                        }
                    }, 1000);
                    
                    alert('验证码已发送');
                } else {
                    alert(data.message || '发送失败');
                    btn.classList.remove('disabled');
                }
            } catch (error) {
                alert('网络错误');
                btn.classList.remove('disabled');
            }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const code = document.getElementById('code').value;
            const password = document.getElementById('password').value;
            
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
            
            let valid = true;
            
            if (!phone || phone.length !== 11) {
                document.getElementById('phoneError').textContent = '请输入11位手机号';
                document.getElementById('phoneError').style.display = 'block';
                valid = false;
            }
            
            if (!code || code.length !== 6) {
                document.getElementById('codeError').textContent = '请输入6位验证码';
                document.getElementById('codeError').style.display = 'block';
                valid = false;
            }
            
            if (!password || password.length < 8) {
                document.getElementById('passwordError').textContent = '密码至少8位';
                document.getElementById('passwordError').style.display = 'block';
                valid = false;
            }
            
            if (!valid) return;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('注册成功！请登录');
                    window.location.href = '/login';
                } else {
                    alert(data.message || '注册失败');
                }
            } catch (error) {
                alert('网络错误，请重试');
            }
        });
    </script>
</body>
</html>
