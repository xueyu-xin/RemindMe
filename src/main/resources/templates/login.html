<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园生活提醒助手</title>
    <style>
        /* ===== 猫啃什锦黑（可爱圆润中文字体） ===== */
        @font-face {
            font-family: 'MaoKenShiJinHei';
            src: url('/fonts/MaoKenShiJinHei-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 猫啃猪圆体（正文用，圆润柔和） ===== */
        @font-face {
            font-family: 'MaoKenZhuYuanTi';
            src: url('/fonts/MaoKenZhuYuanTi-MaokenZhuyuanTi-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 奶油蜜桃色彩令牌 ===== */
        :root {
            --cream-bg: #FFF5F5;
            --cream-card: #FFFFFF;
            --peach: #FFB5A7;
            --peach-light: #FFCAC0;
            --peach-soft: #FFDFD7;
            --peach-pale: #FFF0EC;
            --brown-deep: #5C4033;
            --brown-mid: #8B7355;
            --brown-light: #B59D85;
            --brown-pale: #F5E6E0;
            --danger: #FF7B89;
            --shadow-soft: 0 4px 20px rgba(255, 181, 167, 0.15);
            --shadow-hover: 0 8px 28px rgba(255, 181, 167, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'MaoKenZhuYuanTi', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF5F5 0%, #FFE4E1 100%);
            color: var(--brown-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
        }

        .auth-container {
            background: var(--cream-card);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 420px;
            border: 2px solid var(--peach-pale);
            animation: floatUp 0.6s ease-out;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-container h1 {
            text-align: center;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin-bottom: 8px;
            color: var(--brown-deep);
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .auth-container .subtitle {
            text-align: center;
            color: var(--brown-mid);
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.8;
        }

        .auth-container .form-group { margin-bottom: 20px; }

        .auth-container label {
            display: block;
            margin-bottom: 10px;
            color: var(--brown-deep);
            font-size: 15px;
            padding-left: 4px;
        }

        .auth-container input {
            width: 100%;
            padding: 12px 18px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--brown-pale);
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            height: 48px;
            transition: all 0.25s ease;
            outline: none;
        }

        .auth-container input:hover { border-color: var(--peach-soft); background: #FFFCF8; }

        .auth-container input:focus {
            border-color: var(--peach);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(255, 181, 167, 0.12);
        }

        .auth-container input::placeholder { color: var(--brown-light); }

        .auth-container .submit-btn {
            width: 100%;
            padding: 12px 24px;
            height: 48px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(255, 181, 167, 0.35);
            margin-top: 8px;
        }

        .auth-container .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 181, 167, 0.45);
        }

        .auth-container .submit-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(255, 181, 167, 0.3);
        }

        .auth-container .submit-btn:disabled {
            background: var(--peach-soft);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        .auth-container .links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--brown-mid);
        }

        .auth-container .links a {
            color: var(--peach);
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-container .links a:hover { color: var(--peach-light); }

        .auth-container .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
            padding-left: 4px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        #toast {
            display: none;
            padding: 12px 24px;
            background: var(--brown-deep);
            color: #FFFFFF;
            border-radius: 12px;
            position: fixed;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            font-size: 14px;
            box-shadow: var(--shadow-hover);
            animation: toastIn 0.35s ease-out;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>🍑 校园生活提醒助手</h1>
        <p class="subtitle">登录您的账号</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11">
                <div class="error" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
                <div class="error" id="passwordError"></div>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">登录</button>
        </form>

        <div class="links">
            <p>还没有账号？<a href="/register">立即注册</a></p>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var phone = urlParams.get('phone');
            if (phone) {
                document.getElementById('phone').value = phone;
            }
        });

        function showToast(message, isSuccess) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            toast.style.background = isSuccess ? '#8ED4A6' : '#FF7B89';
            toast.style.color = '#fff';
            setTimeout(function() {
                toast.style.display = 'none';
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;

            document.querySelectorAll('.error').forEach(function(el) {
                el.style.display = 'none';
            });

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号', false);
                return;
            }
            if (password.length < 8) {
                showToast('密码至少8位', false);
                return;
            }

            var loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, password: password })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('nickname', data.nickname || '用户');
                    showToast('登录成功！', true);
                    setTimeout(function() { window.location.href = '/index'; }, 1000);
                } else {
                    showToast(data.message || '账号或密码错误', false);
                }
            })
            .catch(function() {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
                showToast('网络错误，请重试', false);
            });
        });
    </script>
</body>
</html>
