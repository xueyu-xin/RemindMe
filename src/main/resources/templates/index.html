<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园生活提醒助手</title>
    <style>
        /* ===== 猫啃什锦黑（标题/加粗用，可爱圆润） ===== */
        @font-face {
            font-family: 'MaoKenShiJinHei';
            src: url('/fonts/MaoKenShiJinHei-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 猫啃猪圆体（正文用，圆润柔和） ===== */
        @font-face {
            font-family: 'MaoKenZhuYuanTi';
            src: url('/fonts/MaoKenZhuYuanTi-MaokenZhuyuanTi-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 奶油蜜桃色彩令牌 ===== */
        :root {
            --cream-bg: #FFF5F5;
            --cream-card: #FFFFFF;
            --peach: #FFB5A7;
            --peach-light: #FFCAC0;
            --peach-soft: #FFDFD7;
            --peach-pale: #FFF0EC;
            --peach-glow: rgba(255, 181, 167, 0.3);
            --pink-accent: #FF8FA3;
            --brown-deep: #5C4033;
            --brown-mid: #8B7355;
            --brown-light: #B59D85;
            --brown-pale: #F5E6E0;
            --danger: #FF7B89;
            --warning: #FFB347;
            --success: #8ED4A6;
            --shadow-soft: 0 4px 20px rgba(255, 181, 167, 0.15);
            --shadow-card: 0 6px 24px rgba(255, 181, 167, 0.18);
            --shadow-hover: 0 10px 32px rgba(255, 181, 167, 0.28);
            --shadow-strong: 0 12px 40px rgba(255, 181, 167, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'MaoKenZhuYuanTi', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF5F5 10%, #FFE4E1 90%);
            background-attachment: fixed;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 标题字体（什锦黑，加粗可爱） ===== */
        .app-header, h2, h3, .modal-title, .card-title, .settings-title,
        .nav-label, .user-name, .confirmation-card .card-title,
        .calendar-header h3, button, .mode-btn.active {
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* ===== 顶部栏 ===== */
        .app-header {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            color: var(--brown-deep);
            padding: 0 20px;
            text-align: center;
            font-size: 22px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            line-height: 64px;
            border-bottom: 2px solid var(--peach-pale);
            box-shadow: 0 2px 16px rgba(255, 181, 167, 0.15);
            letter-spacing: 2px;
        }

        /* ===== 底部导航栏 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            border-top: 2px solid var(--peach-pale);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 68px;
            z-index: 999;
            box-shadow: 0 -4px 22px rgba(255, 181, 167, 0.15);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 32px;
            cursor: pointer;
            color: var(--brown-light);
            transition: all 0.25s ease;
            border-radius: 16px;
        }
        .nav-item:hover {
            color: var(--brown-mid);
            transform: translateY(-3px);
        }
        .nav-item.active {
            color: var(--peach);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.2);
        }
        .nav-icon { font-size: 28px; margin-bottom: 2px; transition: transform 0.25s ease; }
        .nav-label { font-size: 12px; letter-spacing: 0.5px; }

        /* ===== 中间内容区 ===== */
        .content-area {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
            padding-top: 76px;
            padding-bottom: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tab-page {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .tab-page.active {
            display: flex;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-card);
            animation: cardFadeIn 0.4s ease-out;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 聊天页面卡片 - 固定高度，有上下边距 ===== */
        #page-chat .card {
            flex: 0 1 auto;
            height: calc(100vh - 64px - 68px - 40px);
            min-height: 350px;
            max-height: 680px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* ===== 日历页面卡片 - 自适应内容，但高度足够展示全部 ===== */
        #page-calendar .card {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* ===== 我的页面卡片 - 自适应内容 ===== */
        #page-profile .card {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { color: var(--brown-deep); margin-bottom: 18px; font-size: 20px; font-weight: normal; letter-spacing: 1.5px; }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 10px; color: var(--brown-deep); font-size: 16px; padding-left: 4px; }
        input, textarea, select {
            width: 100%;
            padding: 14px 20px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--brown-pale);
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.7;
            height: 50px;
            transition: all 0.25s ease;
            outline: none;
        }
        input:hover, textarea:hover, select:hover { border-color: var(--peach-soft); background: #FFFAFA; }
        input:focus, textarea:focus, select:focus {
            border-color: var(--peach);
            background: #FFFFFF;
            box-shadow: 0 0 0 5px rgba(255, 181, 167, 0.15);
        }
        input::placeholder, textarea::placeholder { color: var(--brown-light); }
        textarea { height: auto; padding: 16px 20px; }

        /* ===== 按钮 ===== */
        button {
            padding: 10px 26px;
            height: 48px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.35);
            position: relative;
            overflow: hidden;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 181, 167, 0.45);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 181, 167, 0.3);
        }
        button:disabled {
            background: var(--peach-soft);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        /* ===== 提醒列表 ===== */
        .reminder-list { list-style: none; }
        .reminder-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--peach-pale);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .reminder-item:last-child { border-bottom: none; }
        .reminder-item:hover { background: var(--cream-bg); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 12px; }
        .reminder-title { color: var(--brown-deep); font-size: 16px; }
        .reminder-time { color: var(--brown-mid); font-size: 14px; margin-top: 4px; }
        .reminder-actions button { padding: 6px 18px; font-size: 14px; margin-left: 10px; height: 36px; border-radius: 12px; }
        .btn-danger { background: linear-gradient(135deg, #FF7B89 0%, #FFA0AB 100%) !important; box-shadow: 0 4px 14px rgba(255, 123, 137, 0.35) !important; }
        .btn-success { background: linear-gradient(135deg, #8ED4A6 0%, #ABDFBE 100%) !important; box-shadow: 0 4px 14px rgba(142, 212, 166, 0.35) !important; }

        /* ===== 聊天区域 ===== */
        .chat-input { display: flex; gap: 12px; margin-top: auto; flex-shrink: 0; }
        .chat-input input { flex: 1; }
        #confirmationContainer { flex-shrink: 0; }
        .prompt-bar { flex-shrink: 0; }
        .chat-history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-bottom: 18px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-history::-webkit-scrollbar { width: 8px; }
        .chat-history::-webkit-scrollbar-track { background: var(--peach-pale); border-radius: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--peach-soft); border-radius: 4px; }
        .chat-history::-webkit-scrollbar-thumb:hover { background: var(--peach-light); }

        .chat-message {
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.75;
            word-break: break-word;
            max-width: 75%;
            width: fit-content;
            width: -moz-fit-content;
            animation: msgPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes msgPop {
            0% { opacity: 0; transform: scale(0.85) translateY(8px); }
            60% { transform: scale(1.03) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-message.user {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.35);
        }

        .chat-message.bot {
            background: var(--cream-card);
            color: var(--brown-deep);
            border: 2px solid var(--peach-pale);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-soft);
        }

        /* 错误消息和重试按钮样式 */
        .error-msg-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
        }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 4px 8px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #bbb;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .retry-btn .retry-text {
            display: none;
            font-size: 12px;
        }
        .retry-btn:hover {
            background: var(--peach-pale);
            color: var(--peach);
        }
        .retry-btn:hover .retry-text {
            display: inline;
        }

        /* ===== 提示栏 ===== */
        .prompt-bar {
            background: linear-gradient(135deg, var(--peach-pale) 0%, #FFF5F0 100%);
            padding: 14px 20px;
            border-radius: 16px;
            margin-bottom: 18px;
            text-align: center;
            color: var(--brown-mid);
            font-size: 15px;
            border: 1px solid var(--peach-soft);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        /* ===== 日历 ===== */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px 0; }
        .weekday { text-align: center; color: var(--brown-mid); padding: 12px 0; font-size: 14px; }
        .day {
            text-align: center;
            padding: 12px 0;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            min-height: 48px;
            font-size: 15px;
            color: var(--brown-deep);
            transition: all 0.2s ease;
        }
        .day:hover {
            background: var(--peach-pale);
            transform: scale(1.05);
        }
        .day.today {
            background: var(--peach-soft);
            color: var(--brown-deep);
        }
        .day.selected {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4);
        }
        .day.has-reminder .red-dot { display: block; }
        .red-dot { display: none; width: 7px; height: 7px; background: var(--pink-accent); border-radius: 50%; margin: 4px auto 0; box-shadow: 0 0 6px rgba(255, 143, 163, 0.5); }
        .day-number { display: block; line-height: 1; }
        .day-festival { display: block; font-size: 10px; color: #e74c3c; margin-top: 2px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .day-lunar { display: block; font-size: 10px; color: var(--brown-light); margin-top: 2px; line-height: 1.2; }
        .day-period { display: block; font-size: 11px; margin-top: 1px; line-height: 1; }
        .day-recurring {
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 12px;
            color: var(--theme-color, #667eea);
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 0 2px #fff;
        }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px; }
        .calendar-header h3 { margin: 0; font-size: 20px; color: var(--brown-deep); letter-spacing: 1.5px; }
        .calendar-title-wrap { display: flex; align-items: center; gap: 8px; position: relative; }
        .period-help-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
            border: 1px solid var(--brown-light);
            border-radius: 50%;
            font-size: 9px;
            color: var(--brown-light);
            cursor: help;
            line-height: 1;
            font-family: sans-serif;
            position: absolute;
            top: -2px;
            right: -18px;
        }
        .period-help-icon:hover {
            border-color: var(--peach);
            color: var(--peach);
        }
        .period-help-icon:hover::after {
            content: '🌙 经期  🌸 排卵期';
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            background: transparent;
            color: var(--brown-light);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 100;
            font-family: 'MaoKenShiJinHei', sans-serif;
            letter-spacing: 0.5px;
        }
        .mode-switch { display: flex; gap: 6px; background: var(--cream-bg); padding: 6px; border-radius: 14px; border: 1px solid var(--peach-pale); }
        .mode-btn {
            padding: 8px 20px;
            height: 38px;
            background: transparent;
            color: var(--brown-light);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            box-shadow: none;
        }
        .mode-btn.active {
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            box-shadow: 0 3px 10px rgba(255, 181, 167, 0.35);
        }
        .mode-btn:hover { background: var(--peach-pale); color: var(--brown-deep); transform: none; }
        .mode-btn.active:hover { background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%); color: #FFFFFF; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .calendar-nav button {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            color: var(--brown-deep);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 22px;
            height: 40px;
            border-radius: 14px;
            line-height: 1.5;
            box-shadow: var(--shadow-soft);
            letter-spacing: 0;
        }
        .calendar-nav button:hover {
            background: var(--peach-pale);
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        #calendarTitle { font-size: 16px; color: var(--brown-deep); letter-spacing: 1px; }
        #scheduleList { padding: 16px 0 0; border-top: 1px solid var(--peach-pale); overflow-y: auto; flex: 1; min-height: 0; }

        #scheduleItems { min-height: 80px; }
        .schedule-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--peach-pale);
            font-size: 15px;
            transition: background 0.2s;
        }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item:hover { background: var(--cream-bg); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
        .schedule-time { color: var(--peach); width: 60px; flex-shrink: 0; }
        .schedule-title { flex: 1; color: var(--brown-deep); }
        .schedule-location { color: var(--brown-light); font-size: 13px; margin-top: 4px; }
        .schedule-tag { font-size: 12px; padding: 3px 10px; border-radius: 10px; margin-left: 8px; }
        .schedule-tag.pending { background: var(--peach-pale); color: var(--brown-mid); }
        .schedule-tag.cancelled { background: var(--brown-pale); color: var(--brown-light); text-decoration: line-through; }
        .empty-schedule { text-align: center; color: var(--brown-light); padding: 30px 0; font-size: 15px; }

        /* ===== 个人资料 ===== */
        .profile-card { text-align: center; padding: 24px 0; flex-shrink: 0; }
        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 6px 22px rgba(255, 181, 167, 0.4);
            overflow: hidden;
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            cursor: pointer;
        }
        .avatar-wrapper .avatar-circle {
            margin: 0;
            width: 100%;
            height: 100%;
        }
        .avatar-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .avatar-wrapper:hover .avatar-mask {
            opacity: 1;
        }
        .user-name { font-size: 20px; color: var(--brown-deep); letter-spacing: 1.5px; }
        .user-phone { font-size: 15px; color: var(--brown-mid); margin-top: 6px; }

        .settings-group { margin-top: 22px; flex-shrink: 0; }
        .settings-title {
            font-size: 15px;
            color: var(--peach);
            padding: 10px 0;
            border-bottom: 2px solid var(--peach-pale);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px;
            cursor: pointer;
            border-bottom: 1px solid var(--peach-pale);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .settings-item:hover { background: var(--cream-bg); padding-left: 14px; padding-right: 14px; }
        .settings-item:last-child { border-bottom: none; }
        .settings-label { font-size: 16px; color: var(--brown-deep); }
        .settings-value { font-size: 15px; color: var(--brown-mid); display: flex; align-items: center; gap: 12px; }
        .settings-arrow { color: var(--brown-light); font-size: 16px; }

        /* ===== 开关 ===== */
        .toggle-switch { position: relative; width: 54px; height: 30px; background: var(--brown-pale); border-radius: 9999px; cursor: pointer; transition: all 0.3s ease; }
        .toggle-switch.active { background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%); box-shadow: 0 3px 10px rgba(255, 181, 167, 0.45); }
        .toggle-knob { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; background: #FFFFFF; border-radius: 50%; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
        .toggle-switch.active .toggle-knob { left: 26px; }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 64, 51, 0.35);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.show { display: flex; }
        .modal-content {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-radius: 28px;
            padding: 32px 28px 24px;
            width: 90%;
            max-width: 400px;

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script>
        let currentUserId = parseInt(localStorage.getItem('userId')) || 1;
        var chatHistoryLoaded = false;
        // 待保存消息队列：用于避免短时间内重复存储同一条
        var pendingSaveKeys = new Set();
        var currentYear, currentMonth;
        var selectedDate = null;
        var viewMode = 'month';
        var currentWeekOffset = 0;
        var allScheduleData = [];

        var stompClient = null;
        var currentConfirmationSessionId = null;
        var isProcessing = false;
        var lastUserInput = '';
        var conflictStates = {};
        var currentConflictList = [];

        // 城市搜索相关状态
        var selectedCityValue = null;   // 选中的城市值（用于保存，如 "广东省-广州市-天河区"）
        var citySearchTimer = null;     // 搜索防抖计时器

        // Toast 提示（与登录页样式统一）
        var toastTimer = null;
        function showToast(message, isSuccess) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            toast.style.background = isSuccess ? '#8ED4A6' : '#FF7B89';
            toast.style.color = '#fff';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.style.display = 'none';
            }, 3000);
        }

        function connectWebSocket() {
            var socket = new SockJS('/ws?user-id=' + currentUserId);
            stompClient = Stomp.over(socket);
            var headers = {};
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                stompClient.connect(headers, function(frame) {
                console.log('WebSocket连接成功: ' + frame);
                stompClient.subscribe('/user/queue/confirmations', function(message) {
                    var card = JSON.parse(message.body);
                    showConfirmationCard(card);
                });
                stompClient.subscribe('/user/queue/messages', function(message) {
                    var msg;
                    try {
                        msg = JSON.parse(message.body);
                    } catch (e) {
                        msg = { type: 'text', message: message.body };
                    }
                    handleWebSocketMessage(msg);
                });
            }, function(error) {
                console.error('WebSocket连接失败:', error);
                setTimeout(connectWebSocket, 5000);
            });
        }

        /**
         * 根据标签名查找确认卡片中对应的值
         * @param {string} label - 标签文本（如"标题"、"时间"、"地点"、"优先级"）
         * @returns {string|null} 对应的值，未找到返回 null
         */
        function getCardFieldValue(label) {
            var card = document.getElementById('confirmationCard');
            if (!card) return null;

            var infoItems = card.querySelectorAll('.info-item');
            for (var i = 0; i < infoItems.length; i++) {
                var labelEl = infoItems[i].querySelector('.info-label');
                if (labelEl && labelEl.textContent === label) {
                    var valueEl = infoItems[i].querySelector('.info-value');
                    return valueEl ? valueEl.textContent : null;
                }
            }
            return null;
        }

        /**
         * 从当前显示的确认卡片中提取完整数据
         * @returns {Object|null} 包含 title/remindTime/location/priority/sessionId 的对象，卡片不存在返回 null
         */
        function getCurrentCardData() {
            var card = document.getElementById('confirmationCard');
            if (!card) return null;

            var data = {
                title: getCardFieldValue('标题'),
                remindTime: getCardFieldValue('时间'),
                location: getCardFieldValue('地点'),
                priority: getCardFieldValue('优先级'),
                sessionId: card.getAttribute('data-session-id')
            };
            return data;
        }

        function showConfirmationCard(card) {
            var container = document.getElementById('confirmationContainer');
            
            if (card.type === 'success') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                originalConfirmationCard = null;
                return;
            }
            
            if (card.type === 'cancelled') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                originalConfirmationCard = null;
                return;
            }
            
            if (card.type === 'timeout') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                originalConfirmationCard = null;
                return;
            }
            
            if (card.type === 'timeout_auto_create') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                originalConfirmationCard = null;
                renderCalendar();
                return;
            }
            
            if (card.type === 'confirmation_card') {
                currentConfirmationSessionId = card.data.sessionId;
                originalConfirmationCard = card;
                var expiresAt = new Date(card.expiresAt);
                var hasConflict = card.data.hasConflict === true;
                
                var sessionId = card.data.sessionId;
                conflictStates = {};
                currentConflictList = [];
                
                if (hasConflict && card.data.conflictList) {
                    try {
                        currentConflictList = JSON.parse(card.data.conflictList);
                        if (!Array.isArray(currentConflictList)) currentConflictList = [];
                    } catch(e) { currentConflictList = []; }
                    
                    currentConflictList.forEach(function(c) {
                        conflictStates[c.id] = 'pending';
                    });
                }
                
                var html = '<div class="confirmation-card ' + (hasConflict ? 'conflict-mode' : '') + '" id="confirmationCard" data-session-id="' + sessionId + '" data-has-conflict="' + (hasConflict ? 'true' : 'false') + '">';
                html += '<div class="card-title">' + card.message + '</div>';
                html += '<div class="card-info">';
                html += '<div class="info-item"><span class="info-label">标题</span><span class="info-value">' + card.data.title + '</span></div>';
                html += '<div class="info-item"><span class="info-label">时间</span><span class="info-value">' + card.data.remindTime + '</span></div>';
                if (card.data.location) {
                    html += '<div class="info-item"><span class="info-label">地点</span><span class="info-value">' + card.data.location + '</span></div>';
                }
                html += '<div class="info-item"><span class="info-label">优先级</span><span class="info-value">' + card.data.priority + '</span></div>';
                html += '</div>';
                
                if (hasConflict && currentConflictList.length > 0) {
                    html += '<div class="conflict-section">';
                    html += '<div class="conflict-section-title">⚠️ 冲突的提醒：</div>';
                    html += '<div class="conflict-select-all">';
                    html += '<input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" ' + (currentConflictList.length === currentConflictList.filter(function(c) { return conflictStates[c.id] === 'selected'; }).length ? 'checked' : '') + '>';
                    html += '<label for="selectAllCheckbox">全选（覆盖所有冲突）</label>';
                    html += '</div>';
                    html += '<div class="conflict-items" id="conflictItems">';
                    currentConflictList.forEach(function(c) {
                        var cid = c.id;
                        var state = conflictStates[cid] || 'pending';
                        var time = c.remindTime || '';
                        if (time && time.length > 16) time = time.substring(5, 16);
                        var rowClass = 'conflict-item-row';
                        if (state === 'selected') {
                            rowClass += ' row-selected';
                        }
                        html += '<div class="' + rowClass + '" id="conflict-row-' + cid + '">';
                        html += '<div class="conflict-checkbox-wrap">';
                        html += '<input type="checkbox" class="conflict-checkbox" id="conflict-checkbox-' + cid + '" data-conflict-id="' + cid + '" ' + (state === 'selected' ? 'checked' : '') + ' onchange="toggleConflictItem(' + cid + ', this)">';
                        html += '</div>';
                        html += '<div class="conflict-info">📌 ' + (c.title || '未命名') + ' - ' + time + '</div>';
                        html += '</div>';
                    });
                    html += '</div>';
                    if (card.data.suggestedTime) {
                        html += '<div class="suggested-time-inline">💡 建议可以改到: ' + card.data.suggestedTime + '</div>';
                    }
                    html += '</div>';
                }
                
                html += '<div class="card-actions">';
                card.actions.forEach(function(action) {
                    html += '<button class="action-btn ' + action.style + '" onclick="handleConfirmationAction(\'' + action.id + '\', \'' + sessionId + '\')">' + action.label + '</button>';
                });
                html += '</div>';
                html += '<div class="card-timer" id="timerText">⏳ 15秒后未确认自动确认</div>';
                html += '</div>';
                
                container.innerHTML = html;
                
                startTimer(expiresAt, card.data.sessionId);
            }
            
            if (card.type === 'execute_card') {
                currentConfirmationSessionId = card.data.sessionId;
                
                var html = '<div class="confirmation-card execute-card" id="confirmationCard" data-session-id="' + card.data.sessionId + '">';
                html += '<div class="card-title">' + card.message + '</div>';
                html += '<div class="card-info">';
                html += '<div class="info-item"><span class="info-label">标题</span><span class="info-value">' + card.data.title + '</span></div>';
                html += '<div class="info-item"><span class="info-label">时间</span><span class="info-value">' + card.data.remindTime + '</span></div>';
                if (card.data.location) {
                    html += '<div class="info-item"><span class="info-label">地点</span><span class="info-value">' + card.data.location + '</span></div>';
                }
                html += '</div>';
                html += '<div class="card-actions">';
                card.actions.forEach(function(action) {
                    html += '<button class="action-btn ' + action.style + '" onclick="handleExecuteAction(\'' + action.id + '\', \'' + card.data.sessionId + '\')">' + action.label + '</button>';
                });
                html += '</div>';
                html += '<div class="card-timer" id="timerText">第 ' + (card.data.attempt || 1) + ' 次提醒，还剩 ' + (3 - (card.data.attempt || 1)) + ' 次机会</div>';
                html += '</div>';
                
                container.innerHTML = html;
            }
        }

        function handleWebSocketMessage(msg) {
            if (!msg || !msg.type) {
                addMessage('bot', msg.message || JSON.stringify(msg));
                return;
            }

            if (msg.type === 'single_confirm_card') {
                renderSingleConfirmCard(msg);
            } else if (msg.type === 'multi_confirm_card') {
                renderMultiConfirmCard(msg);
            } else if (msg.type === 'pending_summary') {
                addMessage('bot', msg.message);
            } else if (msg.type === 'timeout_auto_create') {
                handleTimeoutAutoCreate(msg);
            } else if (msg.type === 'execute_auto_confirm') {
                handleExecuteAutoConfirm(msg);
            } else if (msg.type === 'batch_confirm_result') {
                handleBatchResult(msg);
            } else if (msg.type === 'batch_cancel_result') {
                handleBatchResult(msg);
            } else if (msg.type === 'card_confirmed') {
                handleCardConfirmed(msg);
            } else if (msg.type === 'card_cancelled') {
                handleCardCancelled(msg);
            } else {
                addMessage('bot', msg.message || JSON.stringify(msg));
            }
        }

        function handleTimeoutAutoCreate(msg) {
            if (timerInterval) clearInterval(timerInterval);
            
            addMessage('bot', msg.message || '✅ 已自动确认提醒');
            renderCalendar();
            
            // 立即清空卡片，不延迟，避免用户点击过期会话
            var container = document.getElementById('confirmationContainer');
            if (container) container.innerHTML = '';
        }

        function handleExecuteAutoConfirm(msg) {
            var card = document.getElementById('confirmationCard');
            if (card) {
                card.innerHTML = '<div class="card-title">✅ 提醒已自动确认（3次稍后未响应）</div>';
            }
            addMessage('bot', msg.message || '✅ 提醒已自动确认');
            renderCalendar();
            
            setTimeout(function() {
                var container = document.getElementById('confirmationContainer');
                if (container) container.innerHTML = '';
            }, 2000);
        }

        function handleBatchResult(msg) {
            addMessage('bot', msg.message || '操作完成');
            renderCalendar();
        }

        function handleCardConfirmed(msg) {
            if (timerInterval) clearInterval(timerInterval);
            
            var sessionId = msg.sessionId;
            var title = msg.title || '';
            var remindTime = msg.remindTime || '';
            
            // 查找并移除对应的确认卡片
            if (sessionId) {
                // 先尝试按data-session-id查找单张卡片
                var card = document.querySelector('.confirmation-card[data-session-id="' + sessionId + '"]');
                if (card) {
                    card.remove();
                } else {
                    // 尝试查找multi-confirm卡片中的单个item
                    var item = document.getElementById('item-' + sessionId);
                    if (item) {
                        item.remove();
                        // 如果multi卡片中没有更多item，移除整个卡片
                        var multiCard = document.getElementById('multiConfirmCard');
                        if (multiCard && multiCard.querySelectorAll('.card-list-item').length === 0) {
                            multiCard.remove();
                        }
                    } else {
                        // 都找不到，清空整个容器
                        var container = document.getElementById('confirmationContainer');
                        if (container) container.innerHTML = '';
                    }
                }
            } else {
                // 阶段二确认，清除所有卡片
                var container = document.getElementById('confirmationContainer');
                if (container) container.innerHTML = '';
            }
            
            // 显示确认成功消息
            var message = '✅ 已确认：' + title;
            if (remindTime) {
                message += '，时间 ' + remindTime;
            }
            addMessage('bot', message);
            
            // 刷新日历
            renderCalendar();
        }

        function handleCardCancelled(msg) {
            if (timerInterval) clearInterval(timerInterval);
            
            var sessionId = msg.sessionId;
            var title = msg.title || '';
            
            // 查找并移除对应的确认卡片
            if (sessionId) {
                var card = document.querySelector('.confirmation-card[data-session-id="' + sessionId + '"]');
                if (card) {
                    card.remove();
                } else {
                    var item = document.getElementById('item-' + sessionId);
                    if (item) {
                        item.remove();
                        var multiCard = document.getElementById('multiConfirmCard');
                        if (multiCard && multiCard.querySelectorAll('.card-list-item').length === 0) {
                            multiCard.remove();
                        }
                    } else {
                        var container = document.getElementById('confirmationContainer');
                        if (container) container.innerHTML = '';
                    }
                }
            } else {
                var container = document.getElementById('confirmationContainer');
                if (container) container.innerHTML = '';
            }
            
            // 显示取消消息
            addMessage('bot', '❌ 已取消：' + title);
        }

        function renderSingleConfirmCard(card) {
            var container = document.getElementById('confirmationContainer');
            var html = '<div class="confirmation-card" id="singleConfirmCard" data-session-id="' + card.sessionId + '">';
            html += '<div class="card-title">📋 请确认：' + card.title + '</div>';
            html += '<div class="card-info">';
            html += '<div class="info-item">⏰ ' + card.remindTime + '</div>';
            if (card.location) {
                html += '<div class="info-item">📍 ' + card.location + '</div>';
            }
            html += '</div>';
            html += '<div class="card-timer">⏳ ' + card.expiresAt + ' 前未确认将自动确认</div>';
            html += '<div class="card-actions">';
            html += '<button class="action-btn primary" onclick="handleSingleConfirm(\'' + card.sessionId + '\')">✅ 确认</button>';
            html += '<button class="action-btn danger" onclick="handleSingleCancel(\'' + card.sessionId + '\')">❌ 取消</button>';
            html += '</div>';
            html += '</div>';
            container.innerHTML = html;
        }

        async function handleSingleConfirm(sessionId) {
            if (isProcessing) return;
            isProcessing = true;
            
            // 禁用所有按钮
            var buttons = document.querySelectorAll('.action-btn, .mini-btn');
            buttons.forEach(function(btn) { btn.disabled = true; });
            
            try {
                var headers = { 'Content-Type': 'application/json' };
                var token = localStorage.getItem('token');
                if (token) headers['Authorization'] = 'Bearer ' + token;

                const response = await fetch('/api/confirmations/action', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        sessionId: sessionId,
                        action: 'confirm',
                        userId: currentUserId
                    })
                });
                const result = await response.json();

                if (!result.success) {
                    addMessage('bot', '❌ ' + result.message);
                }
                // 卡片关闭由WebSocket消息 card_confirmed 处理
            } catch (e) {
                addMessage('bot', '❌ 网络错误');
            } finally {
                isProcessing = false;
                buttons.forEach(function(btn) { btn.disabled = false; });
            }
        }

        async function handleAutoConfirm(sessionId) {
            try {

        var timerInterval = null;

        function startTimer(expiresAt, sessionId) {
            if (timerInterval) clearInterval(timerInterval);
            currentTimerSessionId = sessionId;
            
            timerInterval = setInterval(function() {
                var now = new Date();
                var remaining = Math.ceil((expiresAt - now) / 1000);
                
                var timerText = document.getElementById('timerText');
                if (timerText) {
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerText.textContent = '⏳ 确认已超时，请重新输入';
                        // 禁用卡片上的所有按钮
                        var buttons = document.querySelectorAll('.action-btn, .mini-btn');
                        buttons.forEach(function(btn) { btn.disabled = true; });
                    } else {
                        timerText.textContent = '⏰ ' + remaining + '秒后自动确认';
                        if (remaining <= 10) {
                            timerText.classList.add('warning');
                        }
                    }
                }
            }, 1000);
        }

        function toggleSelectAll() {
            var checkbox = document.getElementById('selectAllCheckbox');
            if (!checkbox) return;
            var newState = checkbox.checked;
            
            currentConflictList.forEach(function(c) {
                conflictStates[c.id] = newState ? 'selected' : 'pending';
                var cb = document.getElementById('conflict-checkbox-' + c.id);
                var row = document.getElementById('conflict-row-' + c.id);
                if (cb) cb.checked = newState;
                if (row) {
                    if (newState) {
                        row.classList.add('row-selected');
                    } else {
                        row.classList.remove('row-selected');
                    }
                }
            });
        }

        function toggleConflictItem(conflictId, checkbox) {
            var row = document.getElementById('conflict-row-' + conflictId);
            if (!row) return;
            
            if (checkbox.checked) {
                conflictStates[conflictId] = 'selected';
                row.classList.add('row-selected');
            } else {
                conflictStates[conflictId] = 'pending';
                row.classList.remove('row-selected');
            }
            
            var selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                var selectedCount = currentConflictList.filter(function(c) {
                    return conflictStates[c.id] === 'selected';
                }).length;
                selectAllCheckbox.checked = selectedCount === currentConflictList.length;
            }
        }

        function getSelectedConflictIds() {
            var ids = [];
            for (var cid in conflictStates) {
                if (conflictStates[cid] === 'selected') {
                    ids.push(parseInt(cid));
                }
            }
            return ids;
        }

        async function handleConfirmationAction(action, sessionId) {
            if (isProcessing) return;
            isProcessing = true;
            
            // 禁用所有按钮
            var buttons = document.querySelectorAll('.action-btn, .mini-btn');
            buttons.forEach(function(btn) { btn.disabled = true; });
            
            if (timerInterval) clearInterval(timerInterval);
            
            var headers = { 'Content-Type': 'application/json' };
            var token = localStorage.getItem('token');
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            
            try {
                if (action === 'confirm') {
                    var idsToOverwrite = getSelectedConflictIds();
                    var confirmBody = idsToOverwrite.length > 0
                        ? JSON.stringify({ conflictIds: idsToOverwrite })
                        : null;
                    const response = await fetch('/api/confirmations/' + sessionId + '/confirm?userId=' + currentUserId, {
                        method: 'POST',
                        headers: headers,
                        body: confirmBody
                    });
                    const result = await response.json();
                    if (result.success) {
                        var confirmMsg = result.message;
                        if (result.overwrittenTitle) {
                            confirmMsg = '✅ 已覆盖「' + result.overwrittenTitle + '」，新提醒已创建';
                        }
                        addMessage('bot', confirmMsg);
                        document.getElementById('confirmationContainer').innerHTML = '';
                        currentConfirmationSessionId = null;
                        conflictStates = {};
                        currentConflictList = [];
                        renderCalendar();
                    } else {
                        addMessage('bot', '❌ ' + result.message);
                    }
                } else if (action === 'cancel') {
                    const response = await fetch('/api/confirmations/' + sessionId + '/cancel?userId=' + currentUserId, {
                        method: 'POST',
                        headers: headers
                    });
                    const result = await response.json();
                    if (result.success) {
                        addMessage('bot', result.message);
                        document.getElementById('confirmationContainer').innerHTML = '';
                        currentConfirmationSessionId = null;
                    } else {
                        addMessage('bot', '❌ ' + result.message);
                    }
                } else if (action === 'overwrite') {
                    var selectedIds = getSelectedConflictIds();
                    if (selectedIds.length === 0) {
                        addMessage('bot', '⚠️ 请先勾选要覆盖的冲突提醒（或点击全选）');
                        isProcessing = false;
                        buttons.forEach(function(btn) { btn.disabled = false; });
                        return;
                    }
                    var overwriteBtn = Array.from(buttons).find(function(btn) {
                        return btn.textContent.includes('覆盖') && !btn.textContent.includes('全');
                    });
                    if (overwriteBtn) {
                        overwriteBtn.textContent = '⏳ 覆盖中...';
                        overwriteBtn.disabled = true;
                    }
                    try {
                        var overwriteHeaders = { 'Content-Type': 'application/json' };
                        var overwriteToken = localStorage.getItem('token');
                        if (overwriteToken) overwriteHeaders['Authorization'] = 'Bearer ' + overwriteToken;

                        var overwriteUrl;
                        var overwriteBody = null;
                        if (selectedIds.length === currentConflictList.length) {
                            overwriteUrl = '/api/confirmations/' + sessionId + '/overwrite?userId=' + currentUserId;
                        } else {
                            overwriteUrl = '/api/confirmations/' + sessionId + '/batch-overwrite?userId=' + currentUserId;
                            overwriteBody = JSON.stringify({ conflictIds: selectedIds });
                        }

                        const response = await fetch(overwriteUrl, {
                            method: 'POST',
                            headers: overwriteHeaders,
                            body: overwriteBody
                        });
                        const result = await response.json();
                        if (result.success) {
                            var overwriteMsg = result.message;
                            if (result.overwrittenTitle) {
                                overwriteMsg = '✅ 已覆盖「' + result.overwrittenTitle + '」，新提醒已创建';
                            }
                            addMessage('bot', overwriteMsg);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                            conflictStates = {};
                            currentConflictList = [];
                            renderCalendar();
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                            if (overwriteBtn) {
                                overwriteBtn.textContent = '📝 覆盖';
                                overwriteBtn.disabled = false;
                            }
                        }
                    } catch (e) {
                        addMessage('bot', '❌ 网络错误，请重试');
                        if (overwriteBtn) {
                            overwriteBtn.textContent = '📝 覆盖';
                            overwriteBtn.disabled = false;
                        }
                    }
                    return;
                } else if (action === 'edit') {
                    showEditForm(sessionId);
                } else if (action === 'confirm_direct' || action === 'confirm_skip' || action === 'overwrite_all') {
                    var urlMap = {
                        'confirm_direct': '/api/confirmations/' + sessionId + '/recurring/direct?userId=' + currentUserId,
                        'confirm_skip': '/api/confirmations/' + sessionId + '/recurring/skip?userId=' + currentUserId,
                        'overwrite_all': '/api/confirmations/' + sessionId + '/recurring/overwrite-all?userId=' + currentUserId
                    };
                    var btnLabelMap = {
                        'confirm_direct': '⏳ 创建中...',
                        'confirm_skip': '⏳ 创建中...',
                        'overwrite_all': '⏳ 覆盖中...'
                    };
                    var clickedBtn = Array.from(buttons).find(function(btn) { return btn.disabled && btn.textContent.indexOf('⏳') === -1; });
                    if (clickedBtn) clickedBtn.textContent = btnLabelMap[action] || '⏳ 处理中...';

                    const response = await fetch(urlMap[action], { method: 'POST', headers: headers });
                    const result = await response.json();
                    if (result.success) {
                        var msg = result.message;
                        if (result.overwrittenTitle) {
                            msg = '✅ 已覆盖「' + result.overwrittenTitle + '」，' + result.message;
                        }
                        addMessage('bot', msg);
                        document.getElementById('confirmationContainer').innerHTML = '';
                        currentConfirmationSessionId = null;
                        if (typeof originalConfirmationCard !== 'undefined') originalConfirmationCard = null;
                        renderCalendar();
                    } else {
                        addMessage('bot', '❌ ' + (result.message || result.error || '操作失败'));
                        buttons.forEach(function(btn) { btn.disabled = false; });
                    }
                }
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            } finally {
                isProcessing = false;
                buttons.forEach(function(btn) { btn.disabled = false; });
            }
        }

        async function sendChatRequest(text, latitude, longitude) {
            try {
                var headers = { 'Content-Type': 'application/json' };
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                var body = { text: text, userId: currentUserId };
                if (latitude !== undefined && longitude !== undefined) {
                    body.latitude = latitude;
                    body.longitude = longitude;
                }

                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                const result = await response.json();

                if (result.needConfirmation) {
                    // 卡片由 WebSocket 推送，前端不再自己构建
                    // 如果卡片还没显示，才显示等待提示
                    var container = document.getElementById('confirmationContainer');
                    if (!container || container.innerHTML.trim() === '') {
                        addMessage('bot', '⏳ 正在生成确认卡片...');
                    }
                    // sessionId 由 WebSocket 推送时更新，这里不处理
                    return;
                } else if (result.address) {
                    // 位置查询响应：显示地址并更新设置页
                    addMessage('bot', result.message || ('📍 ' + result.address));
                    var valueCityEl = document.getElementById('valueCity');
                    if (valueCityEl) valueCityEl.textContent = result.address;
                    document.getElementById('confirmationContainer').innerHTML = '';
                    currentConfirmationSessionId = null;
                    renderCalendar();
                } else if (result.success) {
                    addMessage('bot', result.message);
                    document.getElementById('confirmationContainer').innerHTML = '';
                    currentConfirmationSessionId = null;
                    renderCalendar();
                    // 位置相关回复时刷新设置页城市显示
                    if (result.message && (result.message.indexOf('📍') !== -1 || result.message.indexOf('城市') !== -1 || result.message.indexOf('位置') !== -1)) {
                        loadProfile && loadProfile();
                    }
                } else if (result.title) {
                    var msg = '✅ 已解析：' + result.title;
                    if (result.remindTime) {
                        msg += '\n时间：' + result.remindTime;
                    } else {
                        msg += '\n（⚠️ 未识别到时间，请手动指定）';
                    }
                    if (result.location) {
                        msg += '\n地点：' + result.location;
                    }
                    if (result.intentType) {
                        msg += '\n意图：' + result.intentType;
                    }
                    addMessage('bot', msg);

                    if (result.remindTime) {
                        createReminder(result.title, result.remindTime, result.location, result.priority);
                    }
                } else {
                    var errMsg = result.message || '解析失败，请重试';
                    if (errMsg.indexOf('未设置当前位置') !== -1) {
                        errMsg = '😅 你还没有设置当前位置，请在设置页面配置哦～';
                    }
                    addMessage('bot', '❌ ' + errMsg);
                }
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            }
        }

        async function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text) return;
            lastUserInput = text; // 保存用户输入，用于重试

            // 位置问法检测
            if (isAskingLocation(text)) {
                addMessage('user', text);
                input.value = '';

                if (!navigator.geolocation) {
                    addMessage('bot', '😅 你的浏览器不支持定位功能哦～');
                    await sendChatRequest(text);
                    return;
                }

                addMessage('bot', '📍 正在获取你的位置...');
                navigator.geolocation.getCurrentPosition(
                    async function(position) {
                        var lat = position.coords.latitude;
                        var lng = position.coords.longitude;
                        await sendChatRequest(text, lat, lng);
                    },
                    async function(err) {
                        var msg = '定位失败';
                        if (err.code === 1) msg = '😢 定位权限被拒绝，将使用默认位置';
                        else if (err.code === 2) msg = '⚠️ 无法获取位置，将使用默认位置';
                        else if (err.code === 3) msg = '⚠️ 定位超时，将使用默认位置';
                        addMessage('bot', msg);
                        await sendChatRequest(text);
                    }
                );
                return;
            }

            addMessage('user', text);
            input.value = '';

            try {
                var headers = { 'Content-Type': 'application/json' };
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                if (currentConfirmationSessionId) {
                    if (/^(确认|是的|好|ok|OK|嗯|行|可以|确定|是)$/.test(text)) {
                        const response = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/confirm?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers
                        });
                        const result = await response.json();
                        if (result.success) {
                            addMessage('bot', result.message);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                            renderCalendar();
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                        }
                        return;
                    }

                    if (/^(取消|算了|不|不要|否)$/.test(text)) {
                        const response = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/cancel?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers
                        });
                        const result = await response.json();
                        if (result.success) {
                            addMessage('bot', result.message);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                        }
                        return;
                    }

                    // 智能修改关键词检测
                    var editKeywords = ['修改', '改成', '改为', '调整为', '变更为', '换成', '改一下', '调整'];
                    var isEditIntent = editKeywords.some(function(keyword) {
                        return text.includes(keyword);
                    });

                    if (isEditIntent) {
                        // 从当前确认卡片中提取完整数据
                        var currentData = getCurrentCardData();
                        if (!currentData) {
                            addMessage('bot', '❌ 当前没有可修改的确认卡片，请先创建提醒');
                            return;
                        }

                        // 确保必要字段存在
                        if (!currentData.title) {
                            addMessage('bot', '❌ 无法提取卡片数据，请重试');
                            return;
                        }

                        // 调用智能修改接口
                        const editResponse = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/smart-edit?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify({
                                userInput: text,
                                currentData: currentData
                            })
                        });
                        const editResult = await editResponse.json();
                        if (editResult.success) {
                            addMessage('bot', editResult.message);
                        } else {
                            addMessage('bot', '❌ ' + editResult.message);
                        }
                        return;
                    }

                    // 非修改指令的输入，直接发送到聊天接口处理
                }

                await sendChatRequest(text);
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            }
        }

        function addMessage(role, text, skipSave) {
            const history = document.getElementById('chatHistory');
            if (!history) return;
            
            // 检测是否为网络错误消息，添加重试按钮（按钮在气泡外面）
            if (role === 'bot' && (text.indexOf('网络错误') !== -1 || text.indexOf('请重试') !== -1)) {
                var msgId = 'msg-' + Date.now();
                var wrapper = document.createElement('div');
                wrapper.className = 'error-msg-wrapper';
                
                var msg = document.createElement('div');
                msg.className = `chat-message ${role}`;
                msg.id = msgId;
                msg.innerHTML = text.replace(/\n/g, '<br>');
                
                var btn = document.createElement('button');
                btn.className = 'retry-btn';
                btn.setAttribute('onclick', 'retryLastMessage(\'' + msgId + '\')');
                btn.setAttribute('title', '重新发送');
                btn.innerHTML = '↻ <span class="retry-text">重试</span>';
                
                wrapper.appendChild(msg);
                wrapper.appendChild(btn);
                history.appendChild(wrapper);
            } else {
                const msg = document.createElement('div');
                msg.className = `chat-message ${role}`;
                msg.innerHTML = text.replace(/\n/g, '<br>');
                history.appendChild(msg);
            }
            
            history.scrollTop = history.scrollHeight;

            // 非跳过存储场景：异步保存消息到后端
            if (!skipSave && text && text.trim().length > 0 && currentUserId) {
                var saveKey = role + '|' + text.length + '|' + text.slice(0, 30) + '|' + Date.now();
                if (pendingSaveKeys.has(saveKey)) return;
                pendingSaveKeys.add(saveKey);
                setTimeout(function() { pendingSaveKeys.delete(saveKey); }, 5000);

                fetch('/api/chat/save-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        role: role,
                        content: text.trim()
                    })
                }).catch(function(err) {
                    // 静默失败，不影响用户使用
                });
            }
        }

        /**

        function loadChatHistory() {
            if (chatHistoryLoaded) return;
            if (!currentUserId) return;
            chatHistoryLoaded = true;

            var history = document.getElementById('chatHistory');
            if (history) {
                var loading = document.createElement('div');
                loading.className = 'chat-message bot loading-msg';
                loading.textContent = '加载中...';
                history.appendChild(loading);
            }

            fetch('/api/chat/history?userId=' + currentUserId + '&limit=50')
                .then(function(res) { return res.json(); })
                .then(function(resp) {
                    // 先清空加载提示和默认空状态
                    if (history) {
                        var loadingEl = history.querySelector('.loading-msg');
                        if (loadingEl) loadingEl.remove();
                    }
                    if (!resp || !resp.success || !resp.data || resp.data.length === 0) {
                        return;
                    }
                    // 后端返回倒序（新→旧），前端需正序渲染（旧→新）
                    var list = resp.data.slice().reverse();
                    list.forEach(function(item) {
                        var role = item.role === 'user' ? 'user' : 'bot';
                        addMessage(role, item.content || '', true);
                    });
                })
                .catch(function(err) {
                    // 加载失败：移除加载提示即可，不打扰用户
                    if (history) {
                        var loadingEl = history.querySelector('.loading-msg');
                        if (loadingEl) loadingEl.remove();
                    }
                });
        }

        async function retryLastMessage(errorMsgId) {
            if (!lastUserInput) {
                addMessage('bot', '❌ 没有可重试的消息');
                return;
            }

            // 清除之前的错误消息
            if (errorMsgId) {
                var errorEl = document.getElementById(errorMsgId);
                if (errorEl) errorEl.remove();
            }

            // 重新发送请求
            try {
                var headers = { 'Content-Type': 'application/json' };
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                if (currentConfirmationSessionId) {
                    if (/^(确认|是的|好|ok|OK|嗯|行|可以|确定|是)$/.test(lastUserInput)) {
                        const response = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/confirm?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers
                        });
                        const result = await response.json();
                        if (result.success) {
                            addMessage('bot', result.message);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                            renderCalendar();
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                        }
                        return;
                    }

                    if (/^(取消|算了|不|不要|否)$/.test(lastUserInput)) {
                        const response = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/cancel?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers
                        });
                        const result = await response.json();
                        if (result.success) {
                            addMessage('bot', result.message);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                        }
                        return;
                    }
                }

                await sendChatRequest(lastUserInput);
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            }
        }

        function getTodayStr() {
            var now = new Date();
            var y = now.getFullYear();
            var m = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function isValidDate(dateStr) {
            if (!dateStr || dateStr === 'null' || dateStr === 'undefined') return false;
            var date = new Date(dateStr);
            return !isNaN(date.getTime());
        }

        function getWeekDateRange(year, month, offset) {
            var now = new Date();
            var referenceDate;
            
            if (year && month && !isNaN(year) && !isNaN(month)) {
                referenceDate = new Date(year, month - 1, 1);
            } else {
                referenceDate = new Date();
            }
            
            var dayOfWeek = referenceDate.getDay();
            var monday = new Date(referenceDate);
            if (dayOfWeek !== 1) {
                monday.setDate(referenceDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            }
            monday.setDate(monday.getDate() + offset * 7);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { monday: monday, sunday: sunday };
        }

        function getTodayWeekRange(offset) {
            var now = new Date();
            var dayOfWeek = now.getDay();
            var monday = new Date(now);
            if (dayOfWeek !== 1) {
                monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            }
            monday.setDate(monday.getDate() + offset * 7);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { monday: monday, sunday: sunday };
        }
