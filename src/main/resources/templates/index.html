<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园生活提醒助手</title>
    <style>
        /* ===== 猫啃什锦黑（标题/加粗用，可爱圆润） ===== */
        @font-face {
            font-family: 'MaoKenShiJinHei';
            src: url('/fonts/MaoKenShiJinHei-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 猫啃猪圆体（正文用，圆润柔和） ===== */
        @font-face {
            font-family: 'MaoKenZhuYuanTi';
            src: url('/fonts/MaoKenZhuYuanTi-MaokenZhuyuanTi-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 奶油蜜桃色彩令牌 ===== */
        :root {
            --cream-bg: #FFF5F5;
            --cream-card: #FFFFFF;
            --peach: #FFB5A7;
            --peach-light: #FFCAC0;
            --peach-soft: #FFDFD7;
            --peach-pale: #FFF0EC;
            --peach-glow: rgba(255, 181, 167, 0.3);
            --pink-accent: #FF8FA3;
            --brown-deep: #5C4033;
            --brown-mid: #8B7355;
            --brown-light: #B59D85;
            --brown-pale: #F5E6E0;
            --danger: #FF7B89;
            --warning: #FFB347;
            --success: #8ED4A6;
            --shadow-soft: 0 4px 20px rgba(255, 181, 167, 0.15);
            --shadow-card: 0 6px 24px rgba(255, 181, 167, 0.18);
            --shadow-hover: 0 10px 32px rgba(255, 181, 167, 0.28);
            --shadow-strong: 0 12px 40px rgba(255, 181, 167, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'MaoKenZhuYuanTi', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF5F5 10%, #FFE4E1 90%);
            background-attachment: fixed;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 标题字体（什锦黑，加粗可爱） ===== */
        .app-header, h2, h3, .modal-title, .card-title, .settings-title,
        .nav-label, .user-name, .confirmation-card .card-title,
        .calendar-header h3, button, .mode-btn.active {
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* ===== 顶部栏 ===== */
        .app-header {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            color: var(--brown-deep);
            padding: 0 20px;
            text-align: center;
            font-size: 22px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            line-height: 64px;
            border-bottom: 2px solid var(--peach-pale);
            box-shadow: 0 2px 16px rgba(255, 181, 167, 0.15);
            letter-spacing: 2px;
        }

        /* ===== 底部导航栏 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            border-top: 2px solid var(--peach-pale);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 68px;
            z-index: 999;
            box-shadow: 0 -4px 22px rgba(255, 181, 167, 0.15);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 32px;
            cursor: pointer;
            color: var(--brown-light);
            transition: all 0.25s ease;
            border-radius: 16px;
        }
        .nav-item:hover {
            color: var(--brown-mid);
            transform: translateY(-3px);
        }
        .nav-item.active {
            color: var(--peach);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.2);
        }
        .nav-icon { font-size: 28px; margin-bottom: 2px; transition: transform 0.25s ease; }
        .nav-label { font-size: 12px; letter-spacing: 0.5px; }

        /* ===== 中间内容区 ===== */
        .content-area {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
            padding-top: 76px;
            padding-bottom: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tab-page {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .tab-page.active {
            display: flex;
        }

        /* ===== 卡片 ===== */
        .card {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-card);
            animation: cardFadeIn 0.4s ease-out;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 聊天页面卡片 - 固定高度，有上下边距 ===== */
        #page-chat .card {
            flex: 0 1 auto;
            height: calc(100vh - 64px - 68px - 40px);
            min-height: 350px;
            max-height: 680px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* ===== 日历页面卡片 - 自适应内容，但高度足够展示全部 ===== */
        #page-calendar .card {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* ===== 我的页面卡片 - 自适应内容 ===== */
        #page-profile .card {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { color: var(--brown-deep); margin-bottom: 18px; font-size: 20px; font-weight: normal; letter-spacing: 1.5px; }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 10px; color: var(--brown-deep); font-size: 16px; padding-left: 4px; }
        input, textarea, select {
            width: 100%;
            padding: 14px 20px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--brown-pale);
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.7;
            height: 50px;
            transition: all 0.25s ease;
            outline: none;
        }
        input:hover, textarea:hover, select:hover { border-color: var(--peach-soft); background: #FFFAFA; }
        input:focus, textarea:focus, select:focus {
            border-color: var(--peach);
            background: #FFFFFF;
            box-shadow: 0 0 0 5px rgba(255, 181, 167, 0.15);
        }
        input::placeholder, textarea::placeholder { color: var(--brown-light); }
        textarea { height: auto; padding: 16px 20px; }

        /* ===== 按钮 ===== */
        button {
            padding: 10px 26px;
            height: 48px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.35);
            position: relative;
            overflow: hidden;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 181, 167, 0.45);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 181, 167, 0.3);
        }
        button:disabled {
            background: var(--peach-soft);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        /* ===== 提醒列表 ===== */
        .reminder-list { list-style: none; }
        .reminder-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--peach-pale);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .reminder-item:last-child { border-bottom: none; }
        .reminder-item:hover { background: var(--cream-bg); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 12px; }
        .reminder-title { color: var(--brown-deep); font-size: 16px; }
        .reminder-time { color: var(--brown-mid); font-size: 14px; margin-top: 4px; }
        .reminder-actions button { padding: 6px 18px; font-size: 14px; margin-left: 10px; height: 36px; border-radius: 12px; }
        .btn-danger { background: linear-gradient(135deg, #FF7B89 0%, #FFA0AB 100%) !important; box-shadow: 0 4px 14px rgba(255, 123, 137, 0.35) !important; }
        .btn-success { background: linear-gradient(135deg, #8ED4A6 0%, #ABDFBE 100%) !important; box-shadow: 0 4px 14px rgba(142, 212, 166, 0.35) !important; }

        /* ===== 聊天区域 ===== */
        .chat-input { display: flex; gap: 12px; margin-top: auto; flex-shrink: 0; }
        .chat-input input { flex: 1; }
        #confirmationContainer { flex-shrink: 0; }
        .prompt-bar { flex-shrink: 0; }
        .chat-history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-bottom: 18px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-history::-webkit-scrollbar { width: 8px; }
        .chat-history::-webkit-scrollbar-track { background: var(--peach-pale); border-radius: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--peach-soft); border-radius: 4px; }
        .chat-history::-webkit-scrollbar-thumb:hover { background: var(--peach-light); }

        .chat-message {
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.75;
            word-break: break-word;
            max-width: 75%;
            width: fit-content;
            width: -moz-fit-content;
            animation: msgPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes msgPop {
            0% { opacity: 0; transform: scale(0.85) translateY(8px); }
            60% { transform: scale(1.03) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-message.user {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.35);
        }

        .chat-message.bot {
            background: var(--cream-card);
            color: var(--brown-deep);
            border: 2px solid var(--peach-pale);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-soft);
        }

        /* 错误消息和重试按钮样式 */
        .error-msg-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
        }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 4px 8px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #bbb;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .retry-btn .retry-text {
            display: none;
            font-size: 12px;
        }
        .retry-btn:hover {
            background: var(--peach-pale);
            color: var(--peach);
        }
        .retry-btn:hover .retry-text {
            display: inline;
        }

        /* ===== 提示栏 ===== */
        .prompt-bar {
            background: linear-gradient(135deg, var(--peach-pale) 0%, #FFF5F0 100%);
            padding: 14px 20px;
            border-radius: 16px;
            margin-bottom: 18px;
            text-align: center;
            color: var(--brown-mid);
            font-size: 15px;
            border: 1px solid var(--peach-soft);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        /* ===== 日历 ===== */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px 0; }
        .weekday { text-align: center; color: var(--brown-mid); padding: 12px 0; font-size: 14px; }
        .day {
            text-align: center;
            padding: 12px 0;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            min-height: 48px;
            font-size: 15px;
            color: var(--brown-deep);
            transition: all 0.2s ease;
        }
        .day:hover {
            background: var(--peach-pale);
            transform: scale(1.05);
        }
        .day.today {
            background: var(--peach-soft);
            color: var(--brown-deep);
        }
        .day.selected {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4);
        }
        .day.has-reminder .red-dot { display: block; }
        .red-dot { display: none; width: 7px; height: 7px; background: var(--pink-accent); border-radius: 50%; margin: 4px auto 0; box-shadow: 0 0 6px rgba(255, 143, 163, 0.5); }
        .day-number { display: block; line-height: 1; }
        .day-festival { display: block; font-size: 10px; color: #e74c3c; margin-top: 2px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .day-lunar { display: block; font-size: 10px; color: var(--brown-light); margin-top: 2px; line-height: 1.2; }
        .day-period { display: block; font-size: 11px; margin-top: 1px; line-height: 1; }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px; }
        .calendar-header h3 { margin: 0; font-size: 20px; color: var(--brown-deep); letter-spacing: 1.5px; }
        .calendar-title-wrap { display: flex; align-items: center; gap: 8px; position: relative; }
        .period-help-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
            border: 1px solid var(--brown-light);
            border-radius: 50%;
            font-size: 9px;
            color: var(--brown-light);
            cursor: help;
            line-height: 1;
            font-family: sans-serif;
            position: absolute;
            top: -2px;
            right: -18px;
        }
        .period-help-icon:hover {
            border-color: var(--peach);
            color: var(--peach);
        }
        .period-help-icon:hover::after {
            content: '🌙 经期  🌸 排卵期';
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            background: transparent;
            color: var(--brown-light);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 100;
            font-family: 'MaoKenShiJinHei', sans-serif;
            letter-spacing: 0.5px;
        }
        .mode-switch { display: flex; gap: 6px; background: var(--cream-bg); padding: 6px; border-radius: 14px; border: 1px solid var(--peach-pale); }
        .mode-btn {
            padding: 8px 20px;
            height: 38px;
            background: transparent;
            color: var(--brown-light);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            box-shadow: none;
        }
        .mode-btn.active {
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            box-shadow: 0 3px 10px rgba(255, 181, 167, 0.35);
        }
        .mode-btn:hover { background: var(--peach-pale); color: var(--brown-deep); transform: none; }
        .mode-btn.active:hover { background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%); color: #FFFFFF; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .calendar-nav button {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            color: var(--brown-deep);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 22px;
            height: 40px;
            border-radius: 14px;
            line-height: 1.5;
            box-shadow: var(--shadow-soft);
            letter-spacing: 0;
        }
        .calendar-nav button:hover {
            background: var(--peach-pale);
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        #calendarTitle { font-size: 16px; color: var(--brown-deep); letter-spacing: 1px; }
        #scheduleList { padding: 16px 0 0; border-top: 1px solid var(--peach-pale); overflow-y: auto; flex: 1; min-height: 0; }

        #scheduleItems { min-height: 80px; }
        .schedule-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--peach-pale);
            font-size: 15px;
            transition: background 0.2s;
        }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item:hover { background: var(--cream-bg); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
        .schedule-time { color: var(--peach); width: 60px; flex-shrink: 0; }
        .schedule-title { flex: 1; color: var(--brown-deep); }
        .schedule-location { color: var(--brown-light); font-size: 13px; margin-top: 4px; }
        .schedule-tag { font-size: 12px; padding: 3px 10px; border-radius: 10px; margin-left: 8px; }
        .schedule-tag.pending { background: var(--peach-pale); color: var(--brown-mid); }
        .schedule-tag.cancelled { background: var(--brown-pale); color: var(--brown-light); text-decoration: line-through; }
        .empty-schedule { text-align: center; color: var(--brown-light); padding: 30px 0; font-size: 15px; }

        /* ===== 个人资料 ===== */
        .profile-card { text-align: center; padding: 24px 0; flex-shrink: 0; }
        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 6px 22px rgba(255, 181, 167, 0.4);
        }
        .user-name { font-size: 20px; color: var(--brown-deep); letter-spacing: 1.5px; }
        .user-phone { font-size: 15px; color: var(--brown-mid); margin-top: 6px; }

        .settings-group { margin-top: 22px; flex-shrink: 0; }
        .settings-title {
            font-size: 15px;
            color: var(--peach);
            padding: 10px 0;
            border-bottom: 2px solid var(--peach-pale);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px;
            cursor: pointer;
            border-bottom: 1px solid var(--peach-pale);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .settings-item:hover { background: var(--cream-bg); padding-left: 14px; padding-right: 14px; }
        .settings-item:last-child { border-bottom: none; }
        .settings-label { font-size: 16px; color: var(--brown-deep); }
        .settings-value { font-size: 15px; color: var(--brown-mid); display: flex; align-items: center; gap: 12px; }
        .settings-arrow { color: var(--brown-light); font-size: 16px; }

        /* ===== 开关 ===== */
        .toggle-switch { position: relative; width: 54px; height: 30px; background: var(--brown-pale); border-radius: 9999px; cursor: pointer; transition: all 0.3s ease; }
        .toggle-switch.active { background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%); box-shadow: 0 3px 10px rgba(255, 181, 167, 0.45); }
        .toggle-knob { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; background: #FFFFFF; border-radius: 50%; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
        .toggle-switch.active .toggle-knob { left: 26px; }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 64, 51, 0.35);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.show { display: flex; }
        .modal-content {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-radius: 28px;
            padding: 32px 28px 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-strong);
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.85); }
            60% { transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        .city-picker { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .city-selects { display: flex; gap: 10px; }
        .city-selects select { flex: 1; min-width: 0; padding: 12px 14px; height: 46px; font-size: 14px; }
        .location-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            height: 46px;
            border: 2px solid var(--peach-pale);
            border-radius: 14px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            line-height: 1.5;
            box-shadow: none;
            letter-spacing: 0;
        }
        .location-btn:hover:not(:disabled) {
            background: var(--peach-pale);
            transform: translateY(-1px);

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        let currentUserId = parseInt(localStorage.getItem('userId')) || 1;
        var currentYear, currentMonth;
        var selectedDate = null;
        var viewMode = 'month';
        var currentWeekOffset = 0;
        var allScheduleData = [];

        var stompClient = null;
        var currentConfirmationSessionId = null;
        var isProcessing = false; // 防重复点击标志
        var lastUserInput = ''; // 保存用户输入，用于重试

        function connectWebSocket() {
            var socket = new SockJS('/ws?user-id=' + currentUserId);
            stompClient = Stomp.over(socket);
            var headers = {};
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }
                stompClient.connect(headers, function(frame) {
                console.log('WebSocket连接成功: ' + frame);
                stompClient.subscribe('/user/queue/confirmations', function(message) {
                    var card = JSON.parse(message.body);
                    showConfirmationCard(card);
                });
                stompClient.subscribe('/user/queue/messages', function(message) {
                    var msg;
                    try {
                        msg = JSON.parse(message.body);
                    } catch (e) {
                        msg = { type: 'text', message: message.body };
                    }
                    handleWebSocketMessage(msg);
                });
            }, function(error) {
                console.error('WebSocket连接失败:', error);
                setTimeout(connectWebSocket, 5000);
            });
        }

        /**
         * 根据标签名查找确认卡片中对应的值
         * @param {string} label - 标签文本（如"标题"、"时间"、"地点"、"优先级"）
         * @returns {string|null} 对应的值，未找到返回 null
         */
        function getCardFieldValue(label) {
            var card = document.getElementById('confirmationCard');
            if (!card) return null;

            var infoItems = card.querySelectorAll('.info-item');
            for (var i = 0; i < infoItems.length; i++) {
                var labelEl = infoItems[i].querySelector('.info-label');
                if (labelEl && labelEl.textContent === label) {
                    var valueEl = infoItems[i].querySelector('.info-value');
                    return valueEl ? valueEl.textContent : null;
                }
            }
            return null;
        }

        /**
         * 从当前显示的确认卡片中提取完整数据
         * @returns {Object|null} 包含 title/remindTime/location/priority/sessionId 的对象，卡片不存在返回 null
         */
        function getCurrentCardData() {
            var card = document.getElementById('confirmationCard');
            if (!card) return null;

            var data = {
                title: getCardFieldValue('标题'),
                remindTime: getCardFieldValue('时间'),
                location: getCardFieldValue('地点'),
                priority: getCardFieldValue('优先级'),
                sessionId: card.getAttribute('data-session-id')
            };
            return data;
        }

        function showConfirmationCard(card) {
            var container = document.getElementById('confirmationContainer');
            
            if (card.type === 'success') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                return;
            }
            
            if (card.type === 'cancelled') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                return;
            }
            
            if (card.type === 'timeout') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                return;
            }
            
            if (card.type === 'timeout_auto_create') {
                addMessage('bot', card.message);
                container.innerHTML = '';
                currentConfirmationSessionId = null;
                renderCalendar();
                return;
            }
            
            if (card.type === 'confirmation_card') {
                currentConfirmationSessionId = card.data.sessionId;
                var expiresAt = new Date(card.expiresAt);

        function handleWebSocketMessage(msg) {
            if (!msg || !msg.type) {
                addMessage('bot', msg.message || JSON.stringify(msg));
                return;
            }

            if (msg.type === 'single_confirm_card') {
                renderSingleConfirmCard(msg);
            } else if (msg.type === 'multi_confirm_card') {
                renderMultiConfirmCard(msg);
            } else if (msg.type === 'pending_summary') {
                addMessage('bot', msg.message);
            } else if (msg.type === 'timeout_auto_create') {
                handleTimeoutAutoCreate(msg);
            } else if (msg.type === 'execute_auto_confirm') {
                handleExecuteAutoConfirm(msg);
            } else if (msg.type === 'batch_confirm_result') {
                handleBatchResult(msg);
            } else if (msg.type === 'batch_cancel_result') {
                handleBatchResult(msg);
            } else if (msg.type === 'card_confirmed') {
                handleCardConfirmed(msg);
            } else if (msg.type === 'card_cancelled') {
                handleCardCancelled(msg);
            } else {
                addMessage('bot', msg.message || JSON.stringify(msg));
            }
        }

        function handleCardConfirmed(msg) {
            if (timerInterval) clearInterval(timerInterval);
            
            var sessionId = msg.sessionId;
            var title = msg.title || '';
            var remindTime = msg.remindTime || '';
            
            // 查找并移除对应的确认卡片
            if (sessionId) {
                // 先尝试按data-session-id查找单张卡片
                var card = document.querySelector('.confirmation-card[data-session-id="' + sessionId + '"]');
                if (card) {
                    card.remove();
                } else {
                    // 尝试查找multi-confirm卡片中的单个item
                    var item = document.getElementById('item-' + sessionId);
                    if (item) {
                        item.remove();
                        // 如果multi卡片中没有更多item，移除整个卡片
                        var multiCard = document.getElementById('multiConfirmCard');
                        if (multiCard && multiCard.querySelectorAll('.card-list-item').length === 0) {

                        }
                    } else {
                        // 都找不到，清空整个容器
                        var container = document.getElementById('confirmationContainer');
                        if (container) container.innerHTML = '';
                    }
                }
            } else {
                // 阶段二确认，清除所有卡片
                var container = document.getElementById('confirmationContainer');
                if (container) container.innerHTML = '';
            }
            
            // 显示确认成功消息
            var message = '✅ 已确认：' + title;
            if (remindTime) {
                message += '，时间 ' + remindTime;

        var timerInterval = null;
        var currentTimerSessionId = null;
        function startTimer(expiresAt, sessionId) {
            if (timerInterval) clearInterval(timerInterval);
            currentTimerSessionId = sessionId;
            
            timerInterval = setInterval(function() {
                var now = new Date();
                var remaining = Math.ceil((expiresAt - now) / 1000);
                
                var timerText = document.getElementById('timerText');
                if (timerText) {
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerText.textContent = '⏳ 确认已超时，请重新输入';
                        // 禁用卡片上的所有按钮
                        var buttons = document.querySelectorAll('.action-btn, .mini-btn');
                        buttons.forEach(function(btn) { btn.disabled = true; });
                    } else {
                        timerText.textContent = '⏰ ' + remaining + '秒后自动确认';
                        if (remaining <= 10) {
                            timerText.classList.add('warning');
                        }
                    }
                }
            }, 1000);
        }

        async function handleConfirmationAction(action, sessionId) {
            if (isProcessing) return;
            isProcessing = true;
            
            // 禁用所有按钮
            var buttons = document.querySelectorAll('.action-btn, .mini-btn');
            buttons.forEach(function(btn) { btn.disabled = true; });
            
            if (timerInterval) clearInterval(timerInterval);
            
            var headers = { 'Content-Type': 'application/json' };
            var token = localStorage.getItem('token');
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            
            try {
                if (action === 'confirm') {
                    const response = await fetch('/api/confirmations/' + sessionId + '/confirm?userId=' + currentUserId, {
                        method: 'POST',
                        headers: headers
                    });
                    const result = await response.json();
                    if (result.success) {
                        addMessage('bot', result.message);
                        document.getElementById('confirmationContainer').innerHTML = '';
                        currentConfirmationSessionId = null;
                        renderCalendar();
                    } else {
                        addMessage('bot', '❌ ' + result.message);
                    }
                } else if (action === 'cancel') {
                    const response = await fetch('/api/confirmations/' + sessionId + '/cancel?userId=' + currentUserId, {
                        method: 'POST',
                        headers: headers
                    });
                    const result = await response.json();
                    if (result.success) {
                        addMessage('bot', result.message);
                        document.getElementById('confirmationContainer').innerHTML = '';
                        currentConfirmationSessionId = null;
                    } else {
                        addMessage('bot', '❌ ' + result.message);
                    }
                } else if (action === 'edit') {
                    showEditForm(sessionId);
                }
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            } finally {
                isProcessing = false;
                buttons.forEach(function(btn) { btn.disabled = false; });
            }
        }

        async function sendChatRequest(text, latitude, longitude) {
            try {
                var headers = { 'Content-Type': 'application/json' };
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                var body = { text: text, userId: currentUserId };
                if (latitude !== undefined && longitude !== undefined) {
                    body.latitude = latitude;
                    body.longitude = longitude;
                }

                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                const result = await response.json();

                if (result.needConfirmation) {
                    // 兼容 Agent 模式（result.sessionId）和非 Agent 模式（result.data.sessionId）
                    var sessionId = null;
                    if (result.data && result.data.sessionId) {
                        sessionId = result.data.sessionId;
                    } else if (result.sessionId) {
                        sessionId = result.sessionId;
                    }

                    // 构建 card.data，确保包含 sessionId（showConfirmationCard 依赖 card.data.sessionId）
                    var cardData = result.data || {};
                    if (sessionId && !cardData.sessionId) {
                        cardData.sessionId = sessionId;
                    }

                    var card = {
                        type: 'confirmation_card',
                        message: result.message || '📋 我帮你解析了提醒信息，请确认：',
                        data: cardData,
                        actions: [
                            { id: 'confirm', label: '✅ 确认', style: 'primary' },
                            { id: 'edit', label: '✏️ 修改', style: 'warning' },
                            { id: 'cancel', label: '❌ 取消', style: 'danger' }
                        ],
                        timeout: 180,
                        expiresAt: new Date(Date.now() + 15000).toISOString()
                    };

                    // 双保险：提前设置 currentConfirmationSessionId
                    if (sessionId) {
                        currentConfirmationSessionId = sessionId;
                    }

                    showConfirmationCard(card);
                } else if (result.address) {
                    // 位置查询响应：显示地址并更新设置页
                    addMessage('bot', result.message || ('📍 ' + result.address));
                    var valueCityEl = document.getElementById('valueCity');
                    if (valueCityEl) valueCityEl.textContent = result.address;
                    document.getElementById('confirmationContainer').innerHTML = '';
                    currentConfirmationSessionId = null;
                    renderCalendar();
                } else if (result.success) {
                    addMessage('bot', result.message);
                    document.getElementById('confirmationContainer').innerHTML = '';
                    currentConfirmationSessionId = null;
                    renderCalendar();
                    // 位置相关回复时刷新设置页城市显示
                    if (result.message && (result.message.indexOf('📍') !== -1 || result.message.indexOf('城市') !== -1 || result.message.indexOf('位置') !== -1)) {
                        loadProfile && loadProfile();
                    }
                } else if (result.title) {
                    var msg = '✅ 已解析：' + result.title;
                    if (result.remindTime) {
                        msg += '\n时间：' + result.remindTime;
                    } else {
                        msg += '\n（⚠️ 未识别到时间，请手动指定）';
                    }
                    if (result.location) {
                        msg += '\n地点：' + result.location;
                    }
                    if (result.intentType) {
                        msg += '\n意图：' + result.intentType;
                    }
                    addMessage('bot', msg);

                    if (result.remindTime) {
                        createReminder(result.title, result.remindTime, result.location, result.priority);
                    }
                } else {
                    var errMsg = result.message || '解析失败，请重试';
                    if (errMsg.indexOf('未设置当前位置') !== -1) {
                        errMsg = '😅 你还没有设置当前位置，请在设置页面配置哦～';
                    }
                    addMessage('bot', '❌ ' + errMsg);
                }
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            }
        }

        async function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text) return;
            lastUserInput = text; // 保存用户输入，用于重试

            // 位置问法检测
            if (isAskingLocation(text)) {
                addMessage('user', text);
                input.value = '';

                if (!navigator.geolocation) {
                    addMessage('bot', '😅 你的浏览器不支持定位功能哦～');
                    await sendChatRequest(text);
                    return;
                }

                addMessage('bot', '📍 正在获取你的位置...');
                navigator.geolocation.getCurrentPosition(
                    async function(position) {
                        var lat = position.coords.latitude;
                        var lng = position.coords.longitude;
                        await sendChatRequest(text, lat, lng);
                    },
                    async function(err) {
                        var msg = '定位失败';
                        if (err.code === 1) msg = '😢 定位权限被拒绝，将使用默认位置';
                        else if (err.code === 2) msg = '⚠️ 无法获取位置，将使用默认位置';
                        else if (err.code === 3) msg = '⚠️ 定位超时，将使用默认位置';
                        addMessage('bot', msg);
                        await sendChatRequest(text);
                    }
                );
                return;
            }

            addMessage('user', text);
            input.value = '';

            try {
                var headers = { 'Content-Type': 'application/json' };
                var token = localStorage.getItem('token');
                if (token) {
                    headers['Authorization'] = 'Bearer ' + token;
                }

                if (currentConfirmationSessionId) {
                    if (/^(确认|是的|好|ok|OK|嗯|行|可以|确定|是)$/.test(text)) {
                        const response = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/confirm?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers
                        });
                        const result = await response.json();
                        if (result.success) {
                            addMessage('bot', result.message);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                            renderCalendar();
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                        }
                        return;
                    }

                    if (/^(取消|算了|不|不要|否)$/.test(text)) {
                        const response = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/cancel?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers
                        });
                        const result = await response.json();
                        if (result.success) {
                            addMessage('bot', result.message);
                            document.getElementById('confirmationContainer').innerHTML = '';
                            currentConfirmationSessionId = null;
                        } else {
                            addMessage('bot', '❌ ' + result.message);
                        }
                        return;
                    }

                    // 智能修改关键词检测
                    var editKeywords = ['修改', '改成', '改为', '调整为', '变更为', '换成', '改一下', '调整'];
                    var isEditIntent = editKeywords.some(function(keyword) {
                        return text.includes(keyword);
                    });

                    if (isEditIntent) {
                        // 从当前确认卡片中提取完整数据
                        var currentData = getCurrentCardData();
                        if (!currentData) {
                            addMessage('bot', '❌ 当前没有可修改的确认卡片，请先创建提醒');
                            return;
                        }

                        // 确保必要字段存在
                        if (!currentData.title) {
                            addMessage('bot', '❌ 无法提取卡片数据，请重试');
                            return;
                        }

                        // 调用智能修改接口
                        const editResponse = await fetch('/api/confirmations/' + currentConfirmationSessionId + '/smart-edit?userId=' + currentUserId, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify({
                                userInput: text,
                                currentData: currentData
                            })
                        });
                        const editResult = await editResponse.json();
                        if (editResult.success) {
                            addMessage('bot', editResult.message);
                        } else {
                            addMessage('bot', '❌ ' + editResult.message);
                        }
                        return;
                    }

                    // 非修改指令的输入，直接发送到聊天接口处理
                }

                await sendChatRequest(text);
            } catch (e) {
                addMessage('bot', '❌ 网络错误，请重试');
            }
        }

        function getTodayStr() {
            var now = new Date();
            var y = now.getFullYear();
            var m = String(now.getMonth() + 1).padStart(2, '0');
            var d = String(now.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function isValidDate(dateStr) {
            if (!dateStr || dateStr === 'null' || dateStr === 'undefined') return false;
            var date = new Date(dateStr);
            return !isNaN(date.getTime());
        }

        function renderCalendar() {
            var today = getTodayStr();
            var userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/login';
                return;
            }

            if (!currentYear || !currentMonth || isNaN(currentYear) || isNaN(currentMonth)) {
                var now = new Date();
                currentYear = now.getFullYear();
                currentMonth = now.getMonth() + 1;
            }

            if (viewMode === 'month') {
                var firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
                var daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

                fetch('/api/calendar/month?userId=' + userId + '&year=' + currentYear + '&month=' + currentMonth, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var dayInfo = {};
                    if (data && data.days) {
                        data.days.forEach(function(day) {
                            var dayDate = day.date;
                            var dateStr;
                            if (typeof dayDate === 'string') {
                                dateStr = dayDate;
                            } else {
                                dateStr = currentYear + '-' + String(currentMonth).padStart(2, '0') + '-' + String(day.date).padStart(2, '0');
                            }
                            dayInfo[dateStr] = {
                                hasReminder: day.hasReminder,
                                festival: day.festival,
                                lunarDate: day.lunarDate,
                                periodStatus: day.periodStatus
                            };
                        });
                    }
                    buildCalendarGrid(currentYear, currentMonth, firstDay, daysInMonth, today, dayInfo);
                    loadScheduleData();
                })
                .catch(function() {
                    buildCalendarGrid(currentYear, currentMonth, firstDay, daysInMonth, today, {});
                    loadScheduleData();
                });
            } else {
                var weekRange = getTodayWeekRange(currentWeekOffset);
                var tempDate = new Date(weekRange.monday);
                var dayInfo = {};
                var fetchPromises = [];

                for (var i = 0; i < 7; i++) {
                    var dYear = tempDate.getFullYear();
                    var dMonth = tempDate.getMonth() + 1;
                    var dDay = tempDate.getDate();
                    var dateStr = dYear + '-' + String(dMonth).padStart(2, '0') + '-' + String(dDay).padStart(2, '0');
                    (function(date) {
                        fetchPromises.push(
                            fetch('/api/calendar/day?userId=' + userId + '&date=' + date, {
                                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                            })
                            .then(function(res) { return res.json(); })
                            .then(function(data) {
                                if (data && data.days && data.days[0]) {
                                    var d = data.days[0];
                                    dayInfo[date] = {
                                        hasReminder: d.hasReminder,
                                        festival: d.festival,
                                        lunarDate: d.lunarDate,
                                        periodStatus: d.periodStatus
                                    };
                                }
                            })
                        );
                    })(dateStr);
                    tempDate.setDate(tempDate.getDate() + 1);
                }

                Promise.all(fetchPromises).then(function() {
                    buildWeekGridWithReminders(today, dayInfo);
                    loadScheduleData();
                }).catch(function() {
                    buildWeekGridWithReminders(today, {});
                    loadScheduleData();
                });
            }
        }

        function buildCalendarGrid(year, month, firstDay, daysInMonth, today, dayInfo) {
            var container = document.getElementById('calendarDays');
            container.innerHTML = '';

            for (var i = 0; i < firstDay; i++) {
                var empty = document.createElement('div');
                empty.className = 'day empty';
                container.appendChild(empty);
            }

            for (var d = 1; d <= daysInMonth; d++) {
                var dayDiv = document.createElement('div');
                var dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                dayDiv.className = 'day';
                if (dateStr === today) { dayDiv.classList.add('today'); }
                if (dateStr === selectedDate) { dayDiv.classList.add('selected'); }

                var info = dayInfo[dateStr] || {};
                if (info.hasReminder) { dayDiv.classList.add('has-reminder'); }


                var num = document.createElement('span');
                num.className = 'day-number';
                num.textContent = d;
                dayDiv.appendChild(num);

                // 节日（红色）
                if (info.festival) {
                    var festivalEl = document.createElement('span');
                    festivalEl.className = 'day-festival';
                    festivalEl.textContent = info.festival;
                    dayDiv.appendChild(festivalEl);
                } else if (info.lunarDate) {
                    // 农历日期（灰色小字）

        function getWeekDateRange(year, month, offset) {
            var now = new Date();
            var referenceDate;
            
            if (year && month && !isNaN(year) && !isNaN(month)) {
                referenceDate = new Date(year, month - 1, 1);
            } else {
                referenceDate = new Date();
            }
            
            var dayOfWeek = referenceDate.getDay();
            var monday = new Date(referenceDate);
            if (dayOfWeek !== 1) {
                monday.setDate(referenceDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            }
            monday.setDate(monday.getDate() + offset * 7);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { monday: monday, sunday: sunday };
        }

        function getTodayWeekRange(offset) {
            var now = new Date();
            var dayOfWeek = now.getDay();
            var monday = new Date(now);
            if (dayOfWeek !== 1) {
                monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            }
            monday.setDate(monday.getDate() + offset * 7);
            var sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { monday: monday, sunday: sunday };
        }

        function loadScheduleData() {
            var userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/login';
                return;
            }

            if (!currentYear || !currentMonth || isNaN(currentYear) || isNaN(currentMonth)) {
                var now = new Date();
                currentYear = now.getFullYear();
                currentMonth = now.getMonth() + 1;
            }

            if (selectedDate && isValidDate(selectedDate)) {
                loadDaySchedule(userId, selectedDate);
            } else if (viewMode === 'month') {
                loadMonthSchedule(userId);
            } else {
                loadWeekSchedule(userId);
            }
        }

        function loadDaySchedule(userId, dateStr) {
            document.getElementById('calendarTitle').textContent = dateStr;

            fetch('/api/calendar/day?userId=' + userId + '&date=' + dateStr, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var allReminders = [];
                if (data && data.days && data.days[0] && data.days[0].reminders) {
                    data.days[0].reminders.forEach(function(r) {
                        var dayDate = data.days[0].date;
                        if (dayDate instanceof Date) {
                            var d = new Date(dayDate);
                            r.dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                        } else if (typeof dayDate === 'string') {
                            r.dateStr = dayDate;
                        } else {
                            r.dateStr = dateStr;
                        }
                        allReminders.push(r);
                    });
                }
                allScheduleData = allReminders;
                renderMonthScheduleList(allReminders);
            })
            .catch(function() {
                allScheduleData = [];
                renderMonthScheduleList([]);
            });
        }

        function loadMonthSchedule(userId) {
            document.getElementById('calendarTitle').textContent = currentYear + '年' + currentMonth + '月';

            fetch('/api/calendar/month?userId=' + userId + '&year=' + currentYear + '&month=' + currentMonth, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var allReminders = [];
                if (data && data.days) {
                    data.days.forEach(function(day) {
                        if (day.reminders) {
                            day.reminders.forEach(function(r) {
                                var dayDate = day.date;
                                if (dayDate instanceof Date) {

                                } else if (typeof dayDate === 'string') {
                                    r.dateStr = dayDate;
                                } else {

                renderMonthScheduleList(allReminders);

                renderMonthScheduleList([]);

        function loadWeekSchedule(userId) {
            var weekRange = getTodayWeekRange(currentWeekOffset);

            var mondayYear = weekRange.monday.getFullYear();
            var mondayMonth = weekRange.monday.getMonth() + 1;
            var mondayDay = weekRange.monday.getDate();
            var sundayYear = weekRange.sunday.getFullYear();
            var sundayMonth = weekRange.sunday.getMonth() + 1;
            var sundayDay = weekRange.sunday.getDate();

            if (isNaN(mondayYear) || isNaN(mondayMonth) || isNaN(mondayDay)) {
                var now = new Date();
                mondayYear = now.getFullYear();
                mondayMonth = now.getMonth() + 1;
                mondayDay = now.getDate();
                sundayYear = mondayYear;
                sundayMonth = mondayMonth;
                sundayDay = mondayDay + 6;
            }

            var mondayStr = mondayYear + '-' + String(mondayMonth).padStart(2, '0') + '-' + String(mondayDay).padStart(2, '0');
            var sundayStr = sundayYear + '-' + String(sundayMonth).padStart(2, '0') + '-' + String(sundayDay).padStart(2, '0');

            document.getElementById('calendarTitle').textContent = mondayStr + ' ~ ' + sundayStr;

            var allReminders = [];
            var fetchPromises = [];

            var tempDate = new Date(mondayYear, mondayMonth - 1, mondayDay);

            for (var i = 0; i < 7; i++) {
                var dYear = tempDate.getFullYear();
                var dMonth = tempDate.getMonth() + 1;
                var dDay = tempDate.getDate();
                var dateStr = dYear + '-' + String(dMonth).padStart(2, '0') + '-' + String(dDay).padStart(2, '0');
                (function(date) {
                    fetchPromises.push(
                        fetch('/api/calendar/day?userId=' + userId + '&date=' + date, {
                            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                        })
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            if (data && data.days && data.days[0] && data.days[0].reminders) {
                                data.days[0].reminders.forEach(function(r) {
                                    var dayDate = data.days[0].date;
                                    if (dayDate instanceof Date) {
                                        var d = new Date(dayDate);
                                        r.dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                                    } else if (typeof dayDate === 'string') {
                                        r.dateStr = dayDate;
                                    } else {
                                        r.dateStr = date;
                                    }
                                    allReminders.push(r);
                                });
                            }
                        })
                    );
                })(dateStr);
                tempDate.setDate(tempDate.getDate() + 1);
            }

            Promise.all(fetchPromises).then(function() {
                allScheduleData = allReminders;
                renderScheduleList(allReminders);
            });
        }

        function determineBlockType(reminder) {
            // 1. 检查是否是课程
            if (reminder.source === 'COURSE' || reminder.type === 'course') {
                return 'course';
            }
            // 标题包含"课程"关键词作为备用识别
            if (reminder.title && (reminder.title.indexOf('课程') !== -1 ||
                                   reminder.title.indexOf('课') !== -1 ||
                                   reminder.title.indexOf('上课') !== -1)) {
                return 'course';
            }
            // 2. 根据优先级
            var priority = (reminder.priority || 'NORMAL').toUpperCase();
            var map = {
                'URGENT': 'urgent',
                'HIGH': 'high',
                'NORMAL': 'normal',
                'LOW': 'low'
            };
            return map[priority] || 'default';
        }

        function getWeekDays() {
            var weekRange = getTodayWeekRange(currentWeekOffset);
            var monday = weekRange.monday;
            var days = [];
            for (var i = 0; i < 7; i++) {
                var d = new Date(monday);
                d.setDate(monday.getDate() + i);
                var year = d.getFullYear();
                var month = String(d.getMonth() + 1).padStart(2, '0');
                var day = String(d.getDate()).padStart(2, '0');
                days.push(year + '-' + month + '-' + day);
            }
            return days;
        }

        function renderMonthScheduleList(reminders) {
            var items = document.getElementById('scheduleItems');
            items.innerHTML = '';

            if (!reminders || reminders.length === 0) {
                items.innerHTML = '<div class="empty-schedule">该时段暂无日程安排</div>';
                return;
            }

            var sorted = reminders.slice().sort(function(a, b) {
                return (a.remindTime || '').localeCompare(b.remindTime || '');
            });

            var timeline = document.createElement('div');
            timeline.className = 'schedule-timeline';

            sorted.forEach(function(r) {
                var row = document.createElement('div');
                row.className = 'schedule-row';

                var timeLabel = document.createElement('div');
                timeLabel.className = 'schedule-time-label';
                timeLabel.textContent = r.remindTime ? r.remindTime.slice(11, 16) : '';
                row.appendChild(timeLabel);

                var blocks = document.createElement('div');
                blocks.className = 'schedule-blocks';

                var block = document.createElement('div');
                var type = determineBlockType(r);
                block.className = 'schedule-block ' + type + ' single';

                if (r.status === 'CANCELLED') {
                    block.classList.add('cancelled');
                }

                block.textContent = r.title;
                if (type === 'course') {
                    block.textContent = '📖 ' + r.title;
                }

                block.title = r.title + (r.location ? ' @ ' + r.location : '');
                blocks.appendChild(block);

                row.appendChild(blocks);
                timeline.appendChild(row);
            });

            items.appendChild(timeline);
        }

        function renderScheduleList(reminders) {
            var items = document.getElementById('scheduleItems');
            items.innerHTML = '';

            if (!reminders || reminders.length === 0) {
                items.innerHTML = '<div class="empty-schedule">该时段暂无日程安排</div>';
                return;
            }

            // 获取本周 7 天的日期（从周一到周日）
            var weekDays = getWeekDays();

            // 按时间分组，同时记录日期
            var timeGroups = {};
            reminders.forEach(function(r) {
                var time = r.remindTime.slice(11, 16);
                var dateStr = r.remindTime.slice(0, 10);
                if (!timeGroups[time]) timeGroups[time] = {};
                timeGroups[time][dateStr] = r;
            });

            var sortedTimes = Object.keys(timeGroups).sort();
            var timeline = document.createElement('div');
            timeline.className = 'schedule-timeline';

            sortedTimes.forEach(function(time) {
                var row = document.createElement('div');
                row.className = 'schedule-row';

                // 时间标签
                var timeLabel = document.createElement('div');
                timeLabel.className = 'schedule-time-label';
                timeLabel.textContent = time;
                row.appendChild(timeLabel);

                // 7 列对应 7 天
                var blocks = document.createElement('div');
                blocks.className = 'schedule-blocks-week';

                weekDays.forEach(function(dateStr) {
                    var cell = document.createElement('div');
                    cell.className = 'schedule-cell';

                    var reminder = timeGroups[time] ? timeGroups[time][dateStr] : null;

                    if (reminder) {
                        var block = document.createElement('div');
                        var type = determineBlockType(reminder);
                        block.className = 'schedule-block ' + type + ' week-single';

                        if (reminder.status === 'CANCELLED') {
                            block.classList.add('cancelled');
                        }

                        block.textContent = reminder.title;
                        if (type === 'course') {
                            block.textContent = '📖 ' + reminder.title;
                        }

                        block.title = reminder.title + (reminder.location ? ' @ ' + reminder.location : '');
                        cell.appendChild(block);
                    } else {
                        // 无日程：空白占位
                        var empty = document.createElement('div');
                        empty.className = 'schedule-block empty';
                        cell.appendChild(empty);
                    }

                    blocks.appendChild(cell);
                });

                row.appendChild(blocks);
                timeline.appendChild(row);
            });

            items.appendChild(timeline);
        }

            selectedDate = null;

        function nextPeriod() {
            if (viewMode === 'month') {
                if (currentMonth === 12) { currentMonth = 1; currentYear++; }
                else { currentMonth++; }
            } else {
                currentWeekOffset++;

            selectedDate = null;
            renderCalendar();

        function getLocationInModal() {
            var btn = document.getElementById('getLocationBtn');
            var status = document.getElementById('locationStatus');

            if (!navigator.geolocation) {
                status.textContent = '😅 你的浏览器不支持定位功能';
                return;
            }

            btn.disabled = true;
            btn.textContent = '📍 定位中...';
            status.textContent = '';

            navigator.geolocation.getCurrentPosition(async function(position) {
                try {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var token = localStorage.getItem('token');
                    var userId = localStorage.getItem('userId');
                    var headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = 'Bearer ' + token;

                    var resp = await fetch('/api/user/location?userId=' + userId, {
                        method: 'PUT',
                        headers: headers,
                        body: JSON.stringify({ latitude: lat, longitude: lng })
                    });
                    var data = await resp.json();

                    if (data.success && data.address) {
                        var parts = data.address.split('-');
                        var provSel = document.getElementById('provinceSelect');
                        var citySel = document.getElementById('citySelect');
                        var distSel = document.getElementById('districtSelect');

                        if (parts.length >= 2) {
                            // 选省份，触发联动填充城市
                            provSel.value = parts[0];
                            if (provSel.onchange) provSel.onchange();

                            // 选城市，触发联动填充区县
                            citySel.value = parts[1];
                            if (citySel.onchange) citySel.onchange();

                            // 选区县
                            if (parts.length >= 3) {
                                distSel.value = parts[2];
                            }
                            status.textContent = '✅ 已定位到：' + data.address;
                        } else {
                            status.textContent = '⚠️ 定位结果格式异常：' + data.address;
                        }
                    } else {
                        status.textContent = '⚠️ 定位失败：' + (data.message || '未知错误');
                    }
                } catch (err) {
                    status.textContent = '⚠️ 请求出错：' + err.message;
                } finally {
                    btn.disabled = false;
                    btn.textContent = '📍 获取当前位置';
                }
            }, function(err) {
                var msg = '定位失败';
                if (err.code === 1) msg = '😢 你拒绝了定位权限，请在浏览器设置中允许';
                else if (err.code === 2) msg = '⚠️ 无法获取位置信息，请稍后再试';
                else if (err.code === 3) msg = '⚠️ 定位超时，请稍后再试';
                status.textContent = msg;
                btn.disabled = false;
                btn.textContent = '📍 获取当前位置';
            });
        }

        function selectOption(el) {
            document.querySelectorAll('.modal-option').forEach(function(e) { e.classList.remove('active'); });
            el.classList.add('active');
        }

        function hideModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.getElementById('modalCityPicker').style.display = 'none';
        }

        function confirmModal() {
            var token = localStorage.getItem('token');
            var userId = localStorage.getItem('userId');
            var value = '';

            if (currentEditType === 'input') {
                value = document.getElementById('modalInput').value.trim();
                if (!value) return;
            } else if (currentEditType === 'city') {
                var province = document.getElementById('provinceSelect').value;
                var city = document.getElementById('citySelect').value;
                var district = document.getElementById('districtSelect').value;
                if (!province || !city) return;
                value = province + '-' + city + '-' + (district || '');
            } else {
                var selected = document.querySelector('.modal-option.active');
                if (!selected) return;
                // 将字符串转为数字
                value = parseInt(selected.getAttribute('data-value'), 10);
            }

            var updateData = {};
            updateData[currentEditField] = value;

            fetch('/api/user/' + userId, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(updateData)
            })
            .then(function(response) {
                if (response.ok) {
                    updateProfileDisplay(currentEditField, value);
                    hideModal();
                } else {
                    alert('修改失败，请重试');
                }
            })
            .catch(function() {
                alert('网络错误，请重试');
            });
        }

        function updateProfileDisplay(field, value) {
            if (field === 'nickname') {
                document.getElementById('profileNickname').textContent = value;
                document.getElementById('valueNickname').textContent = value;
            } else if (field === 'gender') {
                var genderMap = { 'MALE': '男', 'FEMALE': '女', 'PRIVATE': '不公开' };
                document.getElementById('valueGender').textContent = genderMap[value] || '不公开';
                if (value === 'FEMALE') {
                    document.getElementById('periodSettings').style.display = 'block';
                    document.getElementById('periodHelpIcon').style.display = 'inline-flex';
                } else {
                    document.getElementById('periodSettings').style.display = 'none';
                    document.getElementById('periodHelpIcon').style.display = 'none';
                }
            } else if (field === 'city') {
                document.getElementById('valueCity').textContent = value;
            } else if (field === 'defaultAdvanceMinutes') {
                document.getElementById('valueAdvance').textContent = value + '分钟';
            } else if (field === 'cycleDays') {
                document.getElementById('valueCycle').textContent = value + '天';
            }
        }

        function togglePeriodReminder() {
            var toggle = document.getElementById('togglePeriodReminder');
            var enabled = !toggle.classList.contains('active');
            toggle.classList.toggle('active', enabled);

            var token = localStorage.getItem('token');
            var userId = localStorage.getItem('userId');

            fetch('/api/user/' + userId, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ enablePeriodReminder: enabled })
            });
        }

        function logout() {
            document.getElementById('logoutModal').classList.add('show');
        }

        function hideLogoutModal() {
            document.getElementById('logoutModal').classList.remove('show');
        }

        function confirmLogout() {
            localStorage.clear();
            window.location.href = '/login';
