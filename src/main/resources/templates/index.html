<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园生活提醒助手</title>
    <link rel="stylesheet" href="/css/main.css?v=20260829b">
    <link rel="stylesheet" href="/css/notification.css?v=20260829b">
    <link rel="stylesheet" href="/css/card.css?v=20260829b">
    <link rel="stylesheet" href="/css/memory.css?v=20260829d">
    <!-- 以下内联样式保留作为兼容回退，核心样式已迁移到外部 CSS 文件 -->
    <style>
        /* ===== 字体定义 ===== */
        @font-face {
            font-family: 'MaoKenShiJinHei';
            src: url('/fonts/MaoKenShiJinHei-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'MaoKenZhuYuanTi';
            src: url('/fonts/MaoKenZhuYuanTi-MaokenZhuyuanTi-2.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }

        /* ===== 色彩令牌 ===== */
        :root {
            --cream-bg: #FFF5F5;
            --cream-card: #FFFFFF;
            --peach: #FFB5A7;
            --peach-light: #FFCAC0;
            --peach-soft: #FFDFD7;
            --peach-pale: #FFF0EC;
            --peach-glow: rgba(255, 181, 167, 0.3);
            --pink-accent: #FF8FA3;
            --brown-deep: #5C4033;
            --brown-mid: #8B7355;
            --brown-light: #B59D85;
            --brown-pale: #F5E6E0;
            --danger: #FF7B89;
            --warning: #FFB347;
            --success: #8ED4A6;
            --shadow-soft: 0 4px 20px rgba(255, 181, 167, 0.15);
            --shadow-card: 0 6px 24px rgba(255, 181, 167, 0.18);
            --shadow-hover: 0 10px 32px rgba(255, 181, 167, 0.28);
            --shadow-strong: 0 12px 40px rgba(255, 181, 167, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            min-height: 100vh;
            font-family: 'MaoKenZhuYuanTi', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #FFF5F5 10%, #FFE4E1 90%);
            background-attachment: fixed;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 标题字体 ===== */
        .app-header, h2, h3, .modal-title, .card-title, .settings-title,
        .nav-label, .user-name, .confirmation-card .card-title,
        .calendar-header h3, button, .mode-btn.active {
            font-family: 'MaoKenShiJinHei', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* ===== 顶部栏 ===== */
        .app-header {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            color: var(--brown-deep);
            padding: 0 20px;
            text-align: center;
            font-size: 22px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            line-height: 64px;
            border-bottom: 2px solid var(--peach-pale);
            box-shadow: 0 2px 16px rgba(255, 181, 167, 0.15);
            letter-spacing: 2px;
        }

        /* ===== 底部导航栏 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            border-top: 2px solid var(--peach-pale);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 68px;
            z-index: 999;
            box-shadow: 0 -4px 22px rgba(255, 181, 167, 0.15);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 32px;
            cursor: pointer;
            color: var(--brown-light);
            transition: all 0.25s ease;
            border-radius: 16px;
        }
        .nav-item:hover {
            color: var(--brown-mid);
            transform: translateY(-3px);
        }
        .nav-item.active {
            color: var(--peach);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.2);
        }
        .nav-icon { font-size: 28px; margin-bottom: 2px; transition: transform 0.25s ease; }
        .nav-label { font-size: 12px; letter-spacing: 0.5px; }

        /* ===== 中间内容区 ===== */
        .content-area {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
            padding-top: 76px;
            padding-bottom: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tab-page {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .tab-page.active {
            display: flex;
        }

        /* ===== 卡片 ===== */
        .rm-card {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-card);
            animation: cardFadeIn 0.4s ease-out;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 聊天页面卡片 ===== */
        #page-chat .rm-card {
            flex: 0 1 auto;
            height: calc(100vh - 64px - 68px - 40px);
            min-height: 350px;
            max-height: 680px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* ===== 日历页面卡片  ===== */
        #page-calendar .rm-card {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        /* ===== 我的页面卡片 - 自适应内容 ===== */
        #page-profile .rm-card {
            flex: 1;
            min-height: 0;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { color: var(--brown-deep); margin-bottom: 18px; font-size: 20px; font-weight: normal; letter-spacing: 1.5px; }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 10px; color: var(--brown-deep); font-size: 16px; padding-left: 4px; }
        input, textarea, select {
            width: 100%;
            padding: 14px 20px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--brown-pale);
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.7;
            height: 50px;
            transition: all 0.25s ease;
            outline: none;
        }
        input:hover, textarea:hover, select:hover { border-color: var(--peach-soft); background: #FFFAFA; }
        input:focus, textarea:focus, select:focus {
            border-color: var(--peach);
            background: #FFFFFF;
            box-shadow: 0 0 0 5px rgba(255, 181, 167, 0.15);
        }
        input::placeholder, textarea::placeholder { color: var(--brown-light); }
        textarea { height: auto; padding: 16px 20px; }

        /* ===== 按钮 ===== */
        button {
            padding: 10px 26px;
            height: 48px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.35);
            position: relative;
            overflow: hidden;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 181, 167, 0.45);
        }
        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 181, 167, 0.3);
        }
        button:disabled {
            background: var(--peach-soft);
            cursor: not-allowed;
            opacity: 0.7;
            box-shadow: none;
        }

        /* ===== 提醒列表 ===== */
        .reminder-list { list-style: none; }
        .reminder-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--peach-pale);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .reminder-item:last-child { border-bottom: none; }
        .reminder-item:hover { background: var(--cream-bg); margin: 0 -12px; padding-left: 12px; padding-right: 12px; border-radius: 12px; }
        .reminder-title { color: var(--brown-deep); font-size: 16px; }
        .reminder-time { color: var(--brown-mid); font-size: 14px; margin-top: 4px; }
        .reminder-actions button { padding: 6px 18px; font-size: 14px; margin-left: 10px; height: 36px; border-radius: 12px; }
        .btn-danger { background: linear-gradient(135deg, #FF7B89 0%, #FFA0AB 100%) !important; box-shadow: 0 4px 14px rgba(255, 123, 137, 0.35) !important; }
        .btn-success { background: linear-gradient(135deg, #8ED4A6 0%, #ABDFBE 100%) !important; box-shadow: 0 4px 14px rgba(142, 212, 166, 0.35) !important; }

        /* ===== 聊天区域 ===== */
        .chat-input { display: flex; gap: 12px; margin-top: auto; flex-shrink: 0; align-items: flex-end; }
        .chat-input textarea#chatInput { flex: 1; resize: none; height: 52px; min-height: 52px; max-height: 120px; overflow-y: auto; font-family: inherit; line-height: 1.5; padding-top: 14px; padding-bottom: 14px; }
        /* 助手回复期间锁定态：输入框与按钮置灰、光标禁用 */
        .chat-input textarea#chatInput:disabled { background: #F7F1EC; color: #B9A79B; cursor: not-allowed; }
        .chat-input button:disabled, .chat-input .upload-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }
        .upload-btn {
            background: var(--peach-pale);
            border: 1px solid var(--peach-border);
            border-radius: 14px;
            padding: 0 12px;
            height: 52px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--brown-mid);
        }
        .upload-btn:hover {
            background: var(--peach-soft);
            transform: scale(1.05);
        }
        .upload-btn:active {
            transform: scale(0.95);
        }

        .batch-items-list {
            margin-top: 12px;
            padding: 8px 12px;
            background: var(--peach-pale);
            border-radius: 12px;
            max-height: 160px;
            overflow-y: auto;
        }
        .batch-item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--peach-border);
            font-size: 13px;
        }
        .batch-item-row:last-child {
            border-bottom: none;
        }
        .batch-item-num {
            color: var(--brown-mid);
            font-weight: 600;
            min-width: 28px;
        }
        .batch-item-title {
            flex: 1;
            color: var(--brown-dark);
            font-weight: 500;
        }
        .batch-item-time {
            color: var(--brown-mid);
            font-size: 12px;
            white-space: nowrap;
        }
        #confirmationContainer {
            flex-shrink: 0;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 8px;
        }
        #confirmationContainer::-webkit-scrollbar {
            width: 6px;
        }
        #confirmationContainer::-webkit-scrollbar-thumb {
            background: var(--peach-pale);
            border-radius: 3px;
        }
        #confirmationContainer::-webkit-scrollbar-thumb:hover {
            background: var(--peach);
        }
        #confirmationContainer::-webkit-scrollbar-track {
            background: transparent;
        }
        .prompt-bar { flex-shrink: 0; }
        .chat-history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin-bottom: 18px;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-history::-webkit-scrollbar { width: 8px; }
        .chat-history::-webkit-scrollbar-track { background: var(--peach-pale); border-radius: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--peach-soft); border-radius: 4px; }
        .chat-history::-webkit-scrollbar-thumb:hover { background: var(--peach-light); }

        .chat-message {
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.75;
            word-break: break-word;
            max-width: 75%;
            width: fit-content;
            width: -moz-fit-content;
            animation: msgPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes msgPop {
            0% { opacity: 0; transform: scale(0.85) translateY(8px); }
            60% { transform: scale(1.03) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-message.user {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.35);
        }

        .chat-message.bot {
            background: var(--cream-card);
            color: var(--brown-deep);
            border: 2px solid var(--peach-pale);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow-soft);
        }

        /* 错误消息和重试按钮样式 */
        .error-msg-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
        }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 4px 8px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #bbb;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .retry-btn .retry-text {
            display: none;
            font-size: 12px;
        }
        .retry-btn:hover {
            background: var(--peach-pale);
            color: var(--peach);
        }
        .retry-btn:hover .retry-text {
            display: inline;
        }

        /* ===== 提示栏 ===== */
        .prompt-bar {
            background: linear-gradient(135deg, var(--peach-pale) 0%, #FFF5F0 100%);
            padding: 14px 20px;
            border-radius: 16px;
            margin-bottom: 18px;
            text-align: center;
            color: var(--brown-mid);
            font-size: 15px;
            border: 1px solid var(--peach-soft);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        /* ===== 日历 ===== */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 8px 0; }
        .weekday { text-align: center; color: var(--brown-mid); padding: 12px 0; font-size: 14px; }
        .day {
            text-align: center;
            padding: 12px 0;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            min-height: 48px;
            font-size: 15px;
            color: var(--brown-deep);
            transition: all 0.2s ease;
        }
        .day:hover {
            background: var(--peach-pale);
            transform: scale(1.05);
        }
        .day.today {
            background: var(--peach-soft);
            color: var(--brown-deep);
        }
        .day.selected {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4);
        }
        .day.has-reminder .red-dot { display: block; }
        .red-dot { display: none; width: 7px; height: 7px; background: var(--pink-accent); border-radius: 50%; margin: 4px auto 0; box-shadow: 0 0 6px rgba(255, 143, 163, 0.5); }
        .day-number { display: block; line-height: 1; }
        .day-festival { display: block; font-size: 10px; color: #e74c3c; margin-top: 2px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .day-lunar { display: block; font-size: 10px; color: var(--brown-light); margin-top: 2px; line-height: 1.2; }
        .day-period { display: block; font-size: 11px; margin-top: 1px; line-height: 1; }
        .day-recurring {
            position: absolute;
            top: 2px;
            right: 3px;
            font-size: 12px;
            color: var(--theme-color, #667eea);
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 0 2px #fff;
        }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px; }
        .calendar-header h3 { margin: 0; font-size: 20px; color: var(--brown-deep); letter-spacing: 1.5px; }
        .calendar-title-wrap { display: flex; align-items: center; gap: 8px; position: relative; }
        .period-help-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
            border: 1px solid var(--brown-light);
            border-radius: 50%;
            font-size: 9px;
            color: var(--brown-light);
            cursor: help;
            line-height: 1;
            font-family: sans-serif;
            position: absolute;
            top: -2px;
            right: -18px;
        }
        .period-help-icon:hover {
            border-color: var(--peach);
            color: var(--peach);
        }
        .period-help-icon:hover::after {
            content: '🌙 经期  🌸 排卵期';
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            background: transparent;
            color: var(--brown-light);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 100;
            font-family: 'MaoKenShiJinHei', sans-serif;
            letter-spacing: 0.5px;
        }
        .mode-switch { display: flex; gap: 6px; background: var(--cream-bg); padding: 6px; border-radius: 14px; border: 1px solid var(--peach-pale); }
        .mode-btn {
            padding: 8px 20px;
            height: 38px;
            background: transparent;
            color: var(--brown-light);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            box-shadow: none;
        }
        .mode-btn.active {
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            box-shadow: 0 3px 10px rgba(255, 181, 167, 0.35);
        }
        .mode-btn:hover { background: var(--peach-pale); color: var(--brown-deep); transform: none; }
        .mode-btn.active:hover { background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%); color: #FFFFFF; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; }
        .calendar-nav button {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            color: var(--brown-deep);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 22px;
            height: 40px;
            border-radius: 14px;
            line-height: 1.5;
            box-shadow: var(--shadow-soft);
            letter-spacing: 0;
        }
        .calendar-nav button:hover {
            background: var(--peach-pale);
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }
        #calendarTitle { font-size: 16px; color: var(--brown-deep); letter-spacing: 1px; cursor: pointer; user-select: none; padding: 4px 10px; border-radius: 8px; transition: background 0.2s; }
        #calendarTitle:hover { background: var(--peach-pale); }

        /* ===== 日期跳转弹窗 ===== */
        .date-picker-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
        .date-picker-selects { display: flex; justify-content: space-around; gap: 20px; padding: 0 10px; }
        .date-picker-select-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .date-picker-select-col label { font-size: 12px; color: var(--brown-light); }
        .date-picker-select-col select {
            width: 100%;
            height: 48px;
            padding: 0 8px;
            border: 1px solid var(--peach-pale);
            border-radius: 8px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }
        .date-picker-select-col select:focus { border-color: var(--peach); box-shadow: 0 0 0 3px rgba(255,181,167,0.15); }
        #scheduleList { padding: 16px 0 0; border-top: 1px solid var(--peach-pale); overflow-y: auto; flex: 1; min-height: 0; }

        #scheduleItems { min-height: 80px; }
        .schedule-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--peach-pale);
            font-size: 15px;
            transition: background 0.2s;
        }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item:hover { background: var(--cream-bg); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 10px; }
        .schedule-time { color: var(--peach); width: 60px; flex-shrink: 0; }
        .schedule-title { flex: 1; color: var(--brown-deep); }
        .schedule-location { color: var(--brown-light); font-size: 13px; margin-top: 4px; }
        .schedule-tag { font-size: 12px; padding: 3px 10px; border-radius: 10px; margin-left: 8px; }
        .schedule-tag.pending { background: var(--peach-pale); color: var(--brown-mid); }
        .schedule-tag.cancelled { background: var(--brown-pale); color: var(--brown-light); text-decoration: line-through; }
        .empty-schedule { text-align: center; color: var(--brown-light); padding: 30px 0; font-size: 15px; }

        /* ===== 个人资料 ===== */
        .profile-card { text-align: center; padding: 24px 0; flex-shrink: 0; }
        .avatar-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 6px 22px rgba(255, 181, 167, 0.4);
            overflow: hidden;
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            cursor: pointer;
        }
        .avatar-wrapper .avatar-circle {
            margin: 0;
            width: 100%;
            height: 100%;
        }
        .avatar-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .avatar-wrapper:hover .avatar-mask {
            opacity: 1;
        }
        .user-name { font-size: 20px; color: var(--brown-deep); letter-spacing: 1.5px; }
        .user-phone { font-size: 15px; color: var(--brown-mid); margin-top: 6px; }

        .settings-group { margin-top: 22px; flex-shrink: 0; }
        .settings-title {
            font-size: 15px;
            color: var(--peach);
            padding: 10px 0;
            border-bottom: 2px solid var(--peach-pale);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px;
            cursor: pointer;
            border-bottom: 1px solid var(--peach-pale);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .settings-item:hover { background: var(--cream-bg); padding-left: 14px; padding-right: 14px; }
        .settings-item:last-child { border-bottom: none; }
        .settings-label { font-size: 16px; color: var(--brown-deep); }
        .settings-value { font-size: 15px; color: var(--brown-mid); display: flex; align-items: center; gap: 12px; }
        .settings-arrow { color: var(--brown-light); font-size: 16px; }

        /* ===== 开关 ===== */
        .toggle-switch { position: relative; width: 54px; height: 30px; background: var(--brown-pale); border-radius: 9999px; cursor: pointer; transition: all 0.3s ease; }
        .toggle-switch.active { background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%); box-shadow: 0 3px 10px rgba(255, 181, 167, 0.45); }
        .toggle-knob { position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; background: #FFFFFF; border-radius: 50%; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
        .toggle-switch.active .toggle-knob { left: 26px; }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 64, 51, 0.35);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.show { display: flex; }
        .modal-content {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-radius: 28px;
            padding: 32px 28px 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-strong);
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.85); }
            60% { transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== Toast 提示 ===== */
        #toast {
            display: none;
            padding: 12px 24px;
            border-radius: 12px;
            position: fixed;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            font-size: 14px;
            box-shadow: var(--shadow-hover);
            animation: toastIn 0.35s ease-out;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 头像裁剪弹窗 ===== */
        .crop-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 10001;
            align-items: center;
            justify-content: center;
        }
        .crop-overlay.show { display: flex; }
        .crop-dialog {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 500px;
            max-width: 90vw;
            padding: 24px;
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .crop-title {
            font-size: 18px;
            color: var(--brown-deep);
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .crop-image-wrapper {
            width: 100%;
            height: 400px;
            overflow: hidden;
            border-radius: 12px;
            background: #f5f5f5;
        }
        .crop-image-wrapper img {
            max-width: 100%;
            display: block;
        }
        .crop-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .crop-buttons button {
            flex: 1;
            height: 46px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .crop-btn-cancel {
            background: #f0f0f0;
            color: var(--brown-mid);
        }
        .crop-btn-cancel:hover { background: #e0e0e0; }
        .crop-btn-confirm {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4);
        }
        .crop-btn-confirm:hover { opacity: 0.9; }

        .city-picker { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .city-selects { display: flex; gap: 10px; }
        .city-selects select { flex: 1; min-width: 0; padding: 12px 14px; height: 46px; font-size: 14px; }

        /* ===== 城市搜索下拉 ===== */
        .city-search-wrapper { position: relative; }
        .city-search-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 240px;
            overflow-y: auto;
            background: #FFFFFF;
            border: 2px solid var(--peach-pale);
            border-radius: 14px;
            margin-top: 6px;
            z-index: 100;
            box-shadow: var(--shadow-hover);
        }
        .city-search-results.show { display: block; }
        .city-search-results::-webkit-scrollbar { width: 6px; }
        .city-search-results::-webkit-scrollbar-track { background: var(--peach-pale); border-radius: 3px; }
        .city-search-results::-webkit-scrollbar-thumb { background: var(--peach-soft); border-radius: 3px; }
        .city-search-item {
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
            color: var(--brown-deep);
            border-bottom: 1px solid var(--peach-pale);
            transition: all 0.15s ease;
        }
        .city-search-item:last-child { border-bottom: none; }
        .city-search-item:hover {
            background: var(--peach-pale);
            padding-left: 24px;
        }
        .city-search-item.selected {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
        }
        .city-search-empty {
            padding: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--brown-light);
        }
        .city-search-loading {
            padding: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--brown-mid);
        }
        .location-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            height: 46px;
            border: 2px solid var(--peach-pale);
            border-radius: 14px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            line-height: 1.5;
            box-shadow: none;
            letter-spacing: 0;
        }
        .location-btn:hover:not(:disabled) {
            background: var(--peach-pale);
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
        }
        .location-btn:disabled { background: var(--brown-pale); color: var(--brown-light); cursor: not-allowed; box-shadow: none; opacity: 0.7; }
        .location-status { font-size: 14px; color: var(--brown-mid); margin-bottom: 16px; min-height: 20px; }
        .modal-title { font-size: 20px; color: var(--brown-deep); margin-bottom: 24px; text-align: center; letter-spacing: 1.5px; }
        .modal-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--brown-pale);
            border-radius: 16px;
            font-family: inherit;
            font-size: 15px;
            height: 46px;
            margin-bottom: 14px;
            outline: none;
            transition: all 0.25s ease;
        }
        .modal-input:focus { background: #FFFFFF; border-color: var(--peach); box-shadow: 0 0 0 5px rgba(255, 181, 167, 0.15); }
        .modal-options { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; justify-content: center; }
        .modal-option {
            padding: 10px 20px;
            height: 40px;
            border: 2px solid var(--peach-pale);
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            background: var(--cream-card);
            color: var(--brown-deep);
            line-height: 1.5;
            transition: all 0.2s ease;
        }
        .modal-option:hover {
            background: var(--peach-pale);
            transform: translateY(-1px);
        }
        .modal-option.active {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4);
        }
        .modal-buttons { display: flex; gap: 12px; }
        .modal-btn {
            flex: 1;
            padding: 10px 20px;
            height: 48px;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }
        .modal-btn.cancel {
            background: var(--cream-bg);
            color: var(--brown-deep);
            border: 2px solid var(--peach-pale);
            box-shadow: none;
        }
        .modal-btn.cancel:hover {
            background: var(--peach-pale);
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
        }
        .modal-btn.confirm {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4);
        }
        .modal-btn.confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 181, 167, 0.5);
        }

        /* ===== 错误 ===== */
        .error { color: var(--danger); font-size: 14px; margin-top: 8px; padding-left: 4px; animation: shake 0.4s ease; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* ===== 确认卡片 ===== */
        .confirmation-card {
            background: var(--cream-card);
            border: 2px solid var(--peach-pale);
            border-left: 4px solid var(--peach);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-soft);
            animation: cardSlideIn 0.35s ease-out;
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .confirmation-card .card-title {
            font-size: 16px;
            color: var(--brown-deep);
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .confirmation-card .card-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }
        .confirmation-card .info-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--brown-mid);
        }
        .confirmation-card .info-label {
            width: 60px;
            color: var(--brown-light);
            flex-shrink: 0;
        }
        .confirmation-card .info-value {
            color: var(--brown-deep);
        }
        .confirmation-card .card-actions {
            display: flex;
            gap: 10px;
        }
        .confirmation-card .action-btn {
            flex: 1;
            padding: 8px 14px;
            height: 38px;
            border: 2px solid var(--peach-pale);
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            line-height: 1.5;
            background: var(--cream-card);
            color: var(--brown-deep) !important;
            -webkit-text-fill-color: var(--brown-deep) !important;
            letter-spacing: 0.5px;
        }
        .confirmation-card .action-btn.primary {
            background: linear-gradient(135deg, var(--peach) 0%, var(--peach-light) 100%);
            color: #FFFFFF !important;
            -webkit-text-fill-color: #FFFFFF !important;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(255, 159, 122, 0.35);
        }
        .confirmation-card .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 159, 122, 0.45);
        }
        .confirmation-card .action-btn.secondary {
            background: var(--cream-bg) !important;
            color: var(--brown-deep) !important;
            -webkit-text-fill-color: var(--brown-deep) !important;
            border-color: var(--peach-pale) !important;
        }
        .confirmation-card .action-btn.secondary:hover {
            background: var(--peach-pale) !important;
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
        }
        .confirmation-card .action-btn.success {
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
            color: #FFFFFF;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.35);
        }
        .confirmation-card .action-btn.success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.45);
        }
        .confirmation-card .action-btn.warning {
            color: var(--brown-deep);
            background: var(--cream-bg);
        }
        .confirmation-card .action-btn.warning:hover {
            background: var(--peach-pale);
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
        }
        .confirmation-card .action-btn.danger {
            color: var(--danger);
            border-color: #FFB3B3;
            background: #FFF5F5;
        }
        .confirmation-card .action-btn.danger:hover {
            background: var(--danger);
            color: #FFFFFF;
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        }
        .confirmation-card .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .confirmation-card .card-timer {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--brown-mid);
        }
        .confirmation-card .card-timer.warning {
            color: var(--danger);
            font-weight: normal;
            animation: timerBlink 1s ease-in-out infinite;
        }

        /* 确认卡片 - 冲突模式 */
        .confirmation-card.conflict-mode {
            border: 2px solid #FFE4B5;
            border-left: 4px solid #FFA500;
        }
        .confirmation-card.conflict-mode .card-title {
            color: #D2691E;
        }
        .conflict-section {
            background: #FFF8E7;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .conflict-section-title {
            font-size: 14px;
            color: #8B4513;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .conflict-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 120px;
            overflow-y: auto;
        }
        .conflict-items::-webkit-scrollbar {
            width: 4px;
        }
        .conflict-items::-webkit-scrollbar-thumb {
            background: var(--peach-soft);
            border-radius: 4px;
        }
        .conflict-select-all {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: var(--peach-pale);
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .conflict-select-all input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--peach);
            cursor: pointer;
        }
        .conflict-select-all label {
            font-size: 13px;
            color: #8B4513;
            cursor: pointer;
        }
        .conflict-item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #8B4513;
            padding: 8px 10px;
            margin: 4px 0;
            background: #FFF9F0;
            border-radius: 8px;
            border: 1px solid var(--peach-pale);
            transition: all 0.2s;
            cursor: pointer;
        }
        .conflict-item-row.row-selected {
            background: var(--peach-pale);
            border-color: var(--peach-soft);
        }
        .conflict-checkbox-wrap {
            flex-shrink: 0;
        }
        .conflict-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--peach);
            cursor: pointer;
        }
        .conflict-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .suggested-time-inline {
            font-size: 13px;
            color: #228B22;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #FFE4B5;
        }

        /* ===== 课表确认卡片 ===== */
        .schedule-table-card .course-list,
        .time-config-card .time-slots-container {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 14px;
        }
        .schedule-table-card .course-list::-webkit-scrollbar,
        .time-config-card .time-slots-container::-webkit-scrollbar {
            width: 5px;
        }
        .schedule-table-card .course-list::-webkit-scrollbar-thumb,
        .time-config-card .time-slots-container::-webkit-scrollbar-thumb {
            background: var(--peach-pale);
            border-radius: 3px;
        }
        .schedule-table-card .course-list-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--brown-deep);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--peach-pale);
        }
        .schedule-table-card .course-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: var(--cream-bg);
            border-radius: 8px;
            font-size: 13px;
        }
        .schedule-table-card .course-index {
            color: var(--brown-light);
            flex-shrink: 0;
            width: 24px;
        }
        .schedule-table-card .course-title {
            color: var(--brown-deep);
            font-weight: 500;
            flex: 1;
        }
        .schedule-table-card .course-info {
            color: var(--brown-mid);
            font-size: 12px;
        }

        /* ===== 时间配置卡片 ===== */
        .time-config-card .info-item {
            flex-wrap: wrap;
            gap: 8px;
        }
        .time-config-card .date-input {
            padding: 6px 10px;
            border: 2px solid var(--peach-pale);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: var(--cream-bg);
            color: var(--brown-deep);
        }
        .time-config-card .link-mode-group {
            margin-bottom: 14px;
        }
        .time-config-card .link-mode-label {
            font-size: 13px;
            color: var(--brown-mid);
            margin-bottom: 8px;
        }
        .time-config-card .link-mode-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .time-config-card .link-mode-btn {
            padding: 6px 12px;
            border: 2px solid var(--peach-pale);
            border-radius: 8px;
            background: var(--cream-card);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--brown-deep);
        }
        .time-config-card .link-mode-btn:hover {
            background: var(--peach-pale);
            color: var(--brown-deep);
        }
        .time-config-card .link-mode-btn.active {
            background: var(--peach);
            color: #FFFFFF;
            border-color: var(--peach);
        }
        .time-config-card .time-slots-header {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            background: var(--peach-pale);
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            color: var(--brown-deep);
            font-weight: 600;
        }
        .time-config-card .time-slots-header span:first-child {
            width: 60px;
        }
        .time-config-card .time-slots-header span {
            flex: 1;
            text-align: center;
        }
        .time-config-card .time-slot-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--peach-pale);
            font-size: 13px;
            color: var(--brown-deep);
        }
        .time-config-card .time-slot-row:last-child {
            border-bottom: none;
        }
        .time-config-card .slot-index {
            width: 60px;
            color: var(--brown-mid);
            font-size: 12px;
        }
        .time-config-card .slot-start,
        .time-config-card .slot-end {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid var(--peach-pale);
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            text-align: center;
            background: var(--cream-bg);
            color: var(--brown-deep);

            align-items: center;
            flex-wrap: wrap;

            border-radius: 10px;
            font-size: 13px;

            font-weight: normal;

            line-height: 20px;

        }
        .schedule-block.multi {
            flex: 1;
            min-width: 0;
            text-align: center;
        }
        .schedule-block.single {
            display: inline-block;
            width: auto;
            max-width: 85%;
        }
        .schedule-block.urgent { background: #FF6B6B; color: #FFFFFF; }
        .schedule-block.high { background: var(--peach); }
        .schedule-block.normal {
            background: #F5C8C8;
            color: var(--brown-deep);
        }
        .schedule-block.low { background: var(--success); }
        .schedule-block.course { background: #C9B1D0; }
        .schedule-block.default { background: var(--brown-light); }
        .schedule-block.cancelled {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .schedule-block.single {
            white-space: normal;
            height: auto;
            min-height: 28px;
            line-height: 1.4;
        }

        .recurring-tag {
            display: inline-block;
            background: rgba(102, 126, 234, 0.25);
            color: #fff;
            padding: 1px 5px;
            border-radius: 6px;
            font-size: 11px;
            margin-right: 4px;
            vertical-align: middle;
            font-weight: 600;
            text-shadow: 0 0 1px rgba(0,0,0,0.2);

        .recurring-tag-sm {
            display: inline-block;
            font-size: 11px;
            color: #fff;
            margin-right: 3px;
            font-weight: bold;
            opacity: 0.9;
        }
        .recurring-range {
            font-size: 10px;
            opacity: 0.8;
            margin-top: 2px;
            display: block;
            line-height: 1.2;
            font-weight: normal;
        }

        /* 7列布局（周查询） */
        .schedule-blocks-week {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            min-height: 30px;
            align-items: center;
        }
        .schedule-cell {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 3px;
            min-height: 30px;
            padding: 2px 0;

            max-height: 28px;
            line-height: 14px;
            padding: 2px 3px;
            font-size: 11px;
        }
        .schedule-block.empty {
            background: transparent;
            min-height: 28px;
            min-width: 20px;
            border: 1px dashed var(--peach-pale);
            border-radius: 6px;
            opacity: 0.3;
            flex: 1;
        }
        .schedule-block.week-single {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            font-size: 12px;
            padding: 4px 4px;
            border-radius: 6px;
            white-space: normal;
            word-break: break-all;
            overflow: hidden;
            max-width: 100%;
            min-height: 40px;
            max-height: 40px;
            line-height: 16px;
            box-sizing: border-box;
        }

        /* 周视图：日历与日程表对齐 */
        .calendar-grid.week-header-mode {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 8px 4px;

            align-items: center;

        }
        .calendar-grid.week-header-mode .week-days-wrap {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
    </style>
</head>

    <script src="/js/sound.js?v=20260829b"></script>
    <script src="/js/notification.js?v=20260829b"></script>
    <script src="/js/card.js?v=20260829b"></script>
    <script src="/js/main.js?v=20260829c"></script>
    <script src="/js/memory.js?v=20260829f"></script>

    
    <!-- 内联 JavaScript 已迁移到 main.js -->


    <div id="toast"></div>

    <!-- 头像裁剪弹窗 -->
    <div class="crop-overlay" id="cropOverlay">
        <div class="crop-dialog">
            <div class="crop-title">裁剪头像</div>
            <div class="crop-image-wrapper">
                <img id="cropImage" src="" alt="裁剪图片">
            </div>
            <div class="crop-buttons">
                <button class="crop-btn-cancel" onclick="cancelCrop()">取消</button>
                <button class="crop-btn-confirm" onclick="confirmCrop()">确认</button>
            </div>
        </div>
    </div>

    <!-- ===== Agent 状态流气泡样式 ===== -->
    <style>
        .as-flow-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            align-self: flex-start;
            max-width: 78%;
            width: fit-content;
            width: -moz-fit-content;
        }

        .as-flow-bubble {
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF9F7 100%) !important;
            border: 2px solid #FFDFD7 !important;
            border-left: 4px solid #FFB5A7 !important;
            border-radius: 20px 20px 20px 6px !important;
            padding: 14px 18px !important;
            max-width: 100% !important;
            width: 100% !important;
            box-shadow: 0 4px 18px rgba(255, 181, 167, 0.18) !important;
            color: #5C4033 !important;
        }
        .as-flow-bubble.as-flow-finished {
            border-left-color: #8ED4A6 !important;
        }
        .as-flow-bubble.as-flow-error {
            border-left-color: #FF7B89 !important;
        }

        .as-flow-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 10px;
            margin-bottom: 4px;
            border-bottom: 1px dashed #FFDFD7;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
            border-radius: 8px;
            padding: 6px 8px;
            margin: -4px -6px 6px;
        }
        .as-flow-header:hover {
            background: #FFF0EC;
        }
        .as-flow-title {
            font-family: 'MaoKenShiJinHei', -apple-system, sans-serif;
            font-size: 15px;
            color: #5C4033;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .as-flow-summary {
            flex: 1;
            text-align: right;
            font-size: 13px;
            color: #8B7355;
            font-family: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .as-summary-text {
            background: #FFF0EC;
            padding: 3px 10px;
            border-radius: 999px;
            color: #8B7355;
        }
        .as-summary-error {
            background: #FFF0F1 !important;
            color: #FF7B89 !important;
        }
        .as-flow-toggle {
            font-size: 11px;
            color: #B59D85;
            flex-shrink: 0;
            padding: 2px 6px;
            border-radius: 8px;
            transition: transform 0.25s ease;
        }
        .as-flow-bubble.as-flow-collapsed .as-flow-toggle {
            transform: rotate(180deg);
        }

        .as-flow-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 6px;
            animation: asFadeIn 0.25s ease;
        }
        @keyframes asFadeIn {
            from { opacity: 0; max-height: 0; }
            to   { opacity: 1; max-height: 1000px; }
        }

        .as-step-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 14px;
            background: #FFF9F7;
            border: 1px solid #FFF0EC;
            transition: all 0.25s ease;
            position: relative;
        }
        .as-step-row.as-step-pending {
            background: #FFF9F7;
        }
        .as-step-row.as-step-done {
            background: #F7FFFA;
            border-color: #D6F1E0;
        }
        .as-step-row.as-step-error {
            background: #FFF2F3 !important;
            border-color: #FFD1D5 !important;
        }

        /* 新步骤入场动画：向上滑入 + 淡入 */
        .as-step-row.as-step-enter {
            animation: asStepEnter 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes asStepEnter {
            0%   { opacity: 0; transform: translateY(8px) scale(0.98); }
            60%  { transform: translateY(-2px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .as-step-icon {
            font-size: 17px;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border-radius: 50%;
            border: 1.5px solid #FFDFD7;
            box-shadow: 0 2px 6px rgba(255, 181, 167, 0.15);
        }
        .as-step-done .as-step-icon {
            border-color: #C6EBD2;
            background: #EEFBF2;
        }
        .as-step-error .as-step-icon {
            border-color: #FFC9CD !important;
            background: #FFEEF0 !important;
        }

        /* pending 状态的图标呼吸动画 */
        .as-step-pending .as-step-icon {
            animation: asPulse 1.3s ease-in-out infinite;
        }
        @keyframes asPulse {
            0%, 100% { transform: scale(1);   box-shadow: 0 2px 6px rgba(255, 181, 167, 0.25); }
            50%      { transform: scale(1.08); box-shadow: 0 4px 14px rgba(255, 181, 167, 0.4); }
        }

        .as-step-body {
            flex: 1;
            min-width: 0;
            padding-top: 3px;
        }
        .as-step-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .as-step-label {
            font-size: 14px;
            color: #5C4033;
            font-family: 'MaoKenShiJinHei', inherit;
            letter-spacing: 0.3px;
        }
        .as-step-pending .as-step-label {
            color: #8B7355;
        }
        .as-step-duration {
            font-size: 11px;
            color: #B59D85;
            background: #FFF0EC;
            padding: 2px 8px;
            border-radius: 999px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .as-step-done .as-step-duration {
            background: #EEFBF2;
            color: #7BAE8D;
        }
        .as-step-detail {
            margin-top: 3px;
            font-size: 12.5px;
            color: #8B7355;
            line-height: 1.6;
            padding-left: 2px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .as-error-detail {
            color: #FF7B89 !important;
        }

        .as-step-check {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
            font-size: 13px;
            color: transparent;
            transition: all 0.25s ease;
        }
        .as-step-done .as-step-check {
            color: #8ED4A6;
            background: #EEFBF2;
            border-radius: 50%;
            font-weight: bold;
            animation: asCheckPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .as-step-error .as-step-check {
            color: #FF7B89 !important;
            background: #FFEEF0 !important;
        }
        @keyframes asCheckPop {
            0%   { transform: scale(0);   opacity: 0; }
            60%  { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1);   opacity: 1; }
        }

        /* 折叠模式下的气泡更紧凑 */
        .as-flow-bubble.as-flow-collapsed .as-flow-header {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            .as-flow-wrapper {
                max-width: 90%;
            }
            .as-flow-bubble {
                padding: 12px 14px !important;
                border-radius: 18px 18px 18px 6px !important;
            }
            .as-step-label {
                font-size: 13.5px;
            }
            .as-step-detail {
                font-size: 12px;
            }
            .as-flow-title {
                font-size: 14px;
            }
        }
    </style>
</body>
</html>
